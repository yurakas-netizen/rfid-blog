<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RFID Ukraine — Конструктор левой панели</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --border: #cbd5e1;
      --border-soft: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --text-soft: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-soft: #e0f2fe;
      --ok-bg: #dcfce7;
      --ok-text: #166534;
      --ok-border: #86efac;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --warn-border: #fcd34d;
      --err-bg: #fee2e2;
      --err-text: #991b1b;
      --err-border: #fca5a5;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.45;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 5px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .mode-badge.is-local { background: #ecfeff; border-color: #a5f3fc; color: #0e7490; }
    .mode-badge.is-github { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-muted);
      border-color: #94a3b8;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-sm { height: 26px; padding: 0 8px; font-size: 11.5px; }
    .btn-danger { background: #fff1f2; border-color: #fecdd3; color: #be123c; }
    .btn-danger:hover:not(:disabled) { background: #ffe4e6; border-color: #fda4af; }
    .btn-accent-soft { background: var(--accent-soft); border-color: #7dd3fc; color: var(--accent-hover); }

    .dirty-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-muted);
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
    }

    .dirty-pill.has-dirty {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }

    .auth-banner {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 16px;
      background: #eff6ff;
      border-bottom: 1px solid #bfdbfe;
    }

    .auth-banner.is-visible { display: flex; }

    .input, .select, .textarea {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
    }

    .input, .select {
      height: 32px;
      padding: 0 9px;
      width: 100%;
    }

    .textarea {
      width: 100%;
      padding: 8px 10px;
      resize: vertical;
      min-height: 62px;
      line-height: 1.45;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.12);
    }

    /* Main Workspace Grid: Editor + Live Sidebar Preview */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      padding: 16px 20px 44px;
      max-width: 1460px;
      width: 100%;
      margin: 0 auto;
      align-items: start;
    }

    @media (max-width: 1060px) {
      .workspace {
        grid-template-columns: 1fr;
        padding: 12px 14px 36px;
      }
    }

    .editor-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .subbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
    }

    .tabs {
      display: inline-flex;
      flex-wrap: wrap;
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
    }

    .tab-btn {
      border: 0;
      border-right: 1px solid var(--border-soft);
      background: var(--surface-muted);
      color: var(--text-muted);
      padding: 6px 13px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn:last-child { border-right: 0; }

    .tab-btn.is-active {
      background: var(--accent);
      color: #ffffff;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .card-title {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
    }

    .card-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-soft);
    }

    .item-box {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fcfdff;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-box.is-disabled {
      opacity: 0.72;
      background: #f8fafc;
    }

    .item-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .item-title-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .icon-preview-box {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .icon-preview-box svg {
      width: 16px;
      height: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 720px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .check-row {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .vis-box {
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: var(--surface);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vis-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lang-pill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 5px;
    }

    .lang-toggle-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .lang-toggle-chip.is-selected {
      background: var(--accent-soft);
      border-color: #38bdf8;
      color: var(--accent-hover);
    }

    .lang-toggle-chip.is-excluded.is-selected {
      background: var(--err-bg);
      border-color: var(--err-border);
      color: var(--err-text);
    }

    details.i18n-details {
      border: 1px solid var(--border-soft);
      border-radius: 7px;
      background: var(--surface);
      padding: 6px 10px;
    }

    details.i18n-details summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
    }

    .i18n-table {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .i18n-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .i18n-code {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-soft);
      padding: 4px 6px;
      background: var(--surface-muted);
      border-radius: 4px;
      text-align: center;
    }

    .lang-row {
      display: grid;
      grid-template-columns: auto 66px minmax(140px, 1fr) minmax(140px, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fcfdff;
    }

    .lang-row.is-disabled { opacity: 0.65; background: #f8fafc; }

    @media (max-width: 780px) {
      .lang-row {
        grid-template-columns: 1fr;
      }
    }

    /* Live Sticky Sidebar Preview */
    .preview-col {
      position: sticky;
      top: 64px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (max-width: 1060px) {
      .preview-col { position: static; }
    }

    .pv-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .pv-sidebar-frame {
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #f5f5fa;
      color: #0f172a;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 28px -12px rgba(15, 23, 42, 0.16);
    }

    .pv-sidebar-frame.is-dark {
      background: #090d16;
      color: #f8fafc;
      border-color: rgba(56, 189, 248, 0.25);
    }

    .pv-head-grid {
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      column-gap: 10px;
      row-gap: 8px;
    }

    .pv-head-grid.no-logo {
      grid-template-columns: 1fr;
    }

    .pv-logo {
      width: 58px;
      height: 40px;
      padding: 5px 7px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.18) 0%, rgba(56, 189, 248, 0.06) 100%);
      border: 1px solid rgba(56, 189, 248, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pv-logo svg { width: 100%; height: 100%; display: block; }
    .pv-site-title { font-size: 16px; font-weight: 700; line-height: 1.25; }
    .pv-site-sub { grid-column: 1 / -1; font-size: 12px; line-height: 1.4; opacity: 0.72; }

    .pv-menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pv-menu-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: inherit;
      opacity: 0.78;
      text-decoration: none;
    }

    .pv-menu-link.is-first {
      background: rgba(14, 165, 233, 0.12);
      color: #0284c7;
      opacity: 1;
      font-weight: 600;
    }

    .pv-sidebar-frame.is-dark .pv-menu-link.is-first {
      background: #1e293b;
      color: #38bdf8;
    }

    .pv-menu-link svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .pv-bottom {
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.28);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .pv-control-box {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.7);
      font-size: 12.5px;
    }

    .pv-sidebar-frame.is-dark .pv-control-box {
      background: #111827;
      border-color: rgba(56, 189, 248, 0.18);
    }

    .pv-control-box select {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 12.5px;
      outline: none;
    }

    .pv-control-box option {
      background: #ffffff;
      color: #0f172a;
    }

    .pv-sidebar-frame.is-dark .pv-control-box option {
      background: #111827;
      color: #f8fafc;
    }

    .pv-notice {
      padding: 9px 11px;
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 12px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .pv-notice.is-info { border-color: rgba(14, 165, 233, 0.4); background: rgba(14, 165, 233, 0.08); }
    .pv-notice.is-accent { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.08); }
    .pv-notice.is-warn { border-color: rgba(245, 158, 11, 0.45); background: rgba(245, 158, 11, 0.1); }
    .pv-notice.is-subtle { background: rgba(148, 163, 184, 0.12); }

    .pv-notice-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #0284c7; }
    .pv-sidebar-frame.is-dark .pv-notice-badge { color: #38bdf8; }
    .pv-notice.is-warn .pv-notice-badge { color: #d97706; }
    .pv-sidebar-frame.is-dark .pv-notice.is-warn .pv-notice-badge { color: #fbbf24; }
    .pv-notice-title { font-weight: 700; font-size: 12.5px; }
    .pv-notice-link { font-weight: 600; color: #0284c7; font-size: 11.5px; text-decoration: none; }
    .pv-sidebar-frame.is-dark .pv-notice-link { color: #38bdf8; }

    .pv-stats {
      font-size: 11.5px;
      color: var(--text-soft);
      padding: 0 4px;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.56);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.is-open { display: flex; }

    .modal {
      width: min(94vw, 860px);
      max-height: 90vh;
      background: var(--surface);
      border-radius: 11px;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title { margin: 0; font-size: 14.5px; font-weight: 700; }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-foot {
      padding: 10px 16px;
      border-top: 1px solid var(--border-soft);
      background: var(--surface-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .code-area {
      width: 100%;
      min-height: 290px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      background: #0f172a;
      color: #f8fafc;
      resize: vertical;
    }

    .diff-pre {
      margin: 0;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.5;
      max-height: 360px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .diff-line.is-add { background: #ecfdf5; color: #166534; display: block; }
    .diff-line.is-del { background: #fef2f2; color: #991b1b; display: block; }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 200;
      padding: 9px 14px;
      border-radius: 8px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.3);
      display: none;
    }

    .toast.is-visible { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <a href="/admin/" class="btn btn-sm">&larr; В CMS</a>
        <h1 class="brand-title">Конструктор левой панели</h1>
        <span id="modeBadge" class="mode-badge">Определение режима...</span>
        <span id="dirtyPill" class="dirty-pill">Нет изменений</span>
      </div>
      <div class="topbar-actions">
        <button type="button" id="ioModalBtn" class="btn">Экспорт / Импорт пакетом</button>
        <button type="button" id="resetDefaultBtn" class="btn">Сбросить к стандарту</button>
        <button type="button" id="saveBtn" class="btn btn-primary" disabled>Сохранить изменения</button>
      </div>
    </header>

    <div id="githubAuthBanner" class="auth-banner">
      <strong>GitHub API:</strong>
      <input type="text" id="ghRepoInput" class="input" style="width:210px;" value="yurakas-netizen/rfid-blog" placeholder="owner/repo" />
      <input type="text" id="ghBranchInput" class="input" style="width:100px;" value="master" placeholder="branch" />
      <input type="password" id="ghTokenInput" class="input" style="width:230px;" placeholder="GitHub Token (или сессия CMS)" />
      <button type="button" id="ghConnectBtn" class="btn btn-primary btn-sm">Подключиться</button>
      <button type="button" id="ghFromDecapBtn" class="btn btn-sm">Из сессии CMS</button>
      <span id="ghAuthStatus" style="font-size:12px; color:var(--text-muted);"></span>
    </div>

    <div class="workspace">
      <div class="editor-col">
        <div class="subbar">
          <div class="tabs" role="tablist">
            <button type="button" class="tab-btn is-active" data-tab="menu">Пункты меню</button>
            <button type="button" class="tab-btn" data-tab="languages">Языки</button>
            <button type="button" class="tab-btn" data-tab="announcements">Объявления и тексты</button>
            <button type="button" class="tab-btn" data-tab="brand">Бренд и виджеты</button>
            <button type="button" class="tab-btn" data-tab="json">JSON</button>
          </div>
          <span id="tabHint" style="font-size:12px; color:var(--text-soft);">Единый файл конфигурации: <code style="font-family:var(--mono);">data/sidebar.json</code></span>
        </div>

        <div id="tabMenu"></div>

            visibilityMode: mode,
            visibilityLangs: Array.isArray(n.visibilityLangs) ? n.visibilityLangs.map(String) : [],
            badge: String(n.badge || ''),
            title: String(n.title || ''),
            text: String(n.text || ''),
            linkLabel: String(n.linkLabel || ''),
            linkUrl: String(n.linkUrl || ''),
            newTab: Boolean(n.newTab),
            i18n: n.i18n && typeof n.i18n === 'object' ? JSON.parse(JSON.stringify(n.i18n)) : {}
          };
        });

        return {
          version: 1,
          brand: brand,
          controls: controls,
          menuItems: menuItems,
          languages: languages,
          announcements: announcements
        };

      function isDirty() {
        if (!state.config) return false;
        return JSON.stringify(state.config) !== state.originalJson;
      }

      function updateStatusUI() {
        var dirty = isDirty();
        var pill = document.getElementById('dirtyPill');
        pill.textContent = dirty ? 'Есть несохранённые изменения' : 'Нет изменений';
        pill.className = 'dirty-pill' + (dirty ? ' has-dirty' : '');
        document.getElementById('saveBtn').disabled = !dirty;
      }

      function onMutate() {
        updateStatusUI();
        renderLivePreview();
      }

      function isVisible(enabled, mode, langs, lang) {
        if (!enabled) return false;
        if (mode === 'only') return langs.indexOf(lang) !== -1;
        if (mode === 'except') return langs.indexOf(lang) === -1;
        return true;
      }

      function resolveUrlClient(rawUrl, lang) {
        var u = String(rawUrl || '/').trim() || '/';
        if (/^(https?:|mailto:|tel:|#)/i.test(u)) return u;
        if (u === '/admin' || u.indexOf('/admin/') === 0 || u.indexOf('/static/') === 0 || u.indexOf('/assets/') === 0) return u;
        var langObj = SITE_LANGUAGES.find(function (l) { return l.code === lang; });
        var prefix = langObj ? langObj.urlPrefix : '';
        if (!prefix) return u.charAt(0) === '/' ? u : '/' + u;
        var norm = u.charAt(0) === '/' ? u : '/' + u;
        if (norm === prefix || norm.indexOf(prefix + '/') === 0) return norm;
        return norm === '/' ? (prefix + '/') : (prefix + norm);
      }

      /* ---------- Loading (Local Express vs GitHub API) ---------- */
      function readDecapToken() {
        var keys = ['decap-cms-user', 'netlify-cms-user'];
        for (var i = 0; i < keys.length; i++) {
          try {
            var raw = localStorage.getItem(keys[i]);
            if (!raw) continue;
            var obj = JSON.parse(raw);
            if (obj && obj.token) return { token: String(obj.token), login: obj.login || '' };
          } catch (_) {}
        }
        return null;
      }

      function decodeBase64Utf8(b64) {
        var bin = atob(String(b64 || '').replace(/\s+/g, ''));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      }

      async function loadFromGithub() {
        var repo = document.getElementById('ghRepoInput').value.trim() || state.ghRepo;
        var branch = document.getElementById('ghBranchInput').value.trim() || state.ghBranch;
        var tokenIn = document.getElementById('ghTokenInput').value.trim();
        if (tokenIn) state.ghToken = tokenIn;
        state.ghRepo = repo;
        state.ghBranch = branch;

        var statusEl = document.getElementById('ghAuthStatus');
        var headers = { Accept: 'application/vnd.github+json' };
        if (state.ghToken) headers.Authorization = 'Bearer ' + state.ghToken;

        statusEl.textContent = 'Загрузка data/sidebar.json из GitHub...';
        var refRes = await fetch('https://api.github.com/repos/' + repo + '/git/ref/heads/' + encodeURIComponent(branch), { headers: headers });
        if (!refRes.ok) throw new Error('GitHub HTTP ' + refRes.status);
        var refJson = await refRes.json();
        state.ghHeadCommitSha = refJson.object.sha;

        var commitRes = await fetch('https://api.github.com/repos/' + repo + '/git/commits/' + state.ghHeadCommitSha, { headers: headers });
        if (!commitRes.ok) throw new Error('Не удалось загрузить commit');
        var commitJson = await commitRes.json();
        state.ghHeadTreeSha = commitJson.tree.sha;

        var fileRes = await fetch('https://api.github.com/repos/' + repo + '/contents/data/sidebar.json?ref=' + encodeURIComponent(branch), { headers: headers });
        if (fileRes.ok) {
          var fileJson = await fileRes.json();
          var text = decodeBase64Utf8(fileJson.content || '');
          state.config = normalizeClientConfig(JSON.parse(text));
          state.originalJson = JSON.stringify(state.config);
          state.exists = true;
          statusEl.textContent = 'Загружен data/sidebar.json';
        } else if (fileRes.status === 404) {
          state.config = buildDefaultConfig();
          state.originalJson = '';
          state.exists = false;
          statusEl.textContent = 'data/sidebar.json ещё не создан — загружен шаблон';
        } else {
          throw new Error('GitHub HTTP ' + fileRes.status);
        }

        state.mode = 'github';
        var badge = document.getElementById('modeBadge');
        badge.className = 'mode-badge is-github';
        badge.textContent = 'GitHub · ' + repo + '@' + branch;
        renderAll();
      }

      async function loadState() {
        try {
          var res = await fetch('/api/sidebar-builder/state');
          if (res.ok) {
            var json = await res.json();
            if (json && json.mode === 'local') {
              state.mode = 'local';
              state.exists = Boolean(json.exists);
              state.fileHash = json.fileHash || '';
              state.config = normalizeClientConfig(json.config);
              state.originalJson = state.exists ? JSON.stringify(state.config) : '';
              var badge = document.getElementById('modeBadge');
              badge.className = 'mode-badge is-local';
              badge.textContent = 'Локальный диск · data/sidebar.json';
              document.getElementById('githubAuthBanner').classList.remove('is-visible');
              renderAll();
              return;
            }
          }
        } catch (_) {}

        state.mode = 'github';
        document.getElementById('modeBadge').className = 'mode-badge is-github';
        document.getElementById('modeBadge').textContent = 'GitHub API режим';
        document.getElementById('githubAuthBanner').classList.add('is-visible');

        var decap = readDecapToken();
        if (decap && decap.token) {
          state.ghToken = decap.token;
          await loadFromGithub().catch(function (err) {
            document.getElementById('ghAuthStatus').textContent = 'Ошибка: ' + err.message;
            state.config = buildDefaultConfig();
            state.originalJson = '';
            renderAll();
          });
        } else {
          document.getElementById('ghAuthStatus').textContent = 'Войдите в CMS или введите GitHub Token и нажмите «Подключиться»';
          state.config = buildDefaultConfig();
          state.originalJson = '';
          renderAll();
        }
      }

      function parseImportedPackage(rawText) {
        var txt = String(rawText || '').trim();
        if (!txt) throw new Error('Вставьте JSON или выберите файл sidebar-config.json');
        var obj = JSON.parse(txt);
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
          throw new Error('Ожидается JSON-объект конфигурации левой панели');
        }
        if (!Array.isArray(obj.menuItems) && !Array.isArray(obj.languages) && !Array.isArray(obj.announcements) && !obj.brand) {
          throw new Error('В объекте не найдены секции menuItems, languages, announcements или brand');
        }
        return normalizeClientConfig(obj);
      }

      function updateImportSummary() {
        var sum = document.getElementById('ioSummary');
        var txt = document.getElementById('ioTextarea').value;
        if (!txt.trim()) {
          sum.textContent = 'Вставьте содержимое sidebar-config.json или загрузите файл с диска.';
          return;
        }
        try {
          var cfg = parseImportedPackage(txt);
          var activeL = cfg.languages.filter(function (l) { return l.enabled; }).length;
          sum.textContent = 'Проверено: пунктов меню — ' + cfg.menuItems.length +
            ', языков — ' + activeL + '/' + cfg.languages.length +
            ', объявлений — ' + cfg.announcements.length + '.';
        } catch (err) {
          sum.textContent = 'Ошибка разбора: ' + err.message;
        }
      }

      /* ---------- Save / Diff Modal ---------- */
      function computeLineDiff(beforeText, afterText) {
        var a = beforeText ? beforeText.split('\n') : [];
        var b = afterText ? afterText.split('\n') : [];
        var max = Math.max(a.length, b.length);
        var out = [];
        for (var i = 0; i < max; i++) {
          if (a[i] === b[i]) continue;
          if (a[i] !== undefined) out.push({ type: 'del', text: a[i] });
          if (b[i] !== undefined) out.push({ type: 'add', text: b[i] });
        }
        return out.slice(0, 120);
      }

      function openSaveModal() {
        if (!isDirty()) return;
        document.getElementById('saveCommitWrap').style.display = state.mode === 'github' ? 'flex' : 'none';
        document.getElementById('saveModalStatus').textContent = state.exists ? 'Обновление data/sidebar.json' : 'Создание data/sidebar.json';
        document.getElementById('saveConfirmBtn').disabled = false;

        var beforePretty = state.originalJson ? JSON.stringify(JSON.parse(state.originalJson), null, 2) : '';
        var afterPretty = JSON.stringify(state.config, null, 2);
        var diffLines = computeLineDiff(beforePretty, afterPretty);

        var pre = document.getElementById('saveDiffPre');
        pre.innerHTML = '';
        if (!diffLines.length) {
          pre.textContent = 'Изменения форматирования.';
        } else {
          diffLines.forEach(function (dl) {
            pre.appendChild(el('span', { className: 'diff-line is-' + dl.type }, (dl.type === 'del' ? '- ' : '+ ') + dl.text));
          });
        }
        document.getElementById('saveModalBackdrop').classList.add('is-open');
      }

      async function confirmSave() {
        var btn = document.getElementById('saveConfirmBtn');
        var statusEl = document.getElementById('saveModalStatus');
        btn.disabled = true;
        statusEl.textContent = 'Сохранение...';

        try {
          if (state.mode === 'local') {
            var res = await fetch('/api/sidebar-builder/apply', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ expectedHash: state.fileHash, config: state.config })
            });
            var json = await res.json();
            if (!res.ok || !json.ok) throw new Error(json.error || 'Ошибка сохранения');
            document.getElementById('saveModalBackdrop').classList.remove('is-open');
            showToast('Настройки левой панели сохранены');
            await loadState();
          } else {
            var repo = state.ghRepo;
            var branch = state.ghBranch;
            var headers = {
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + state.ghToken
            };
            var refCheck = await fetch('https://api.github.com/repos/' + repo + '/git/ref/heads/' + encodeURIComponent(branch), { headers: headers });
            if (!refCheck.ok) throw new Error('Не удалось проверить HEAD ветки');
            var refData = await refCheck.json();
            if (refData.object.sha !== state.ghHeadCommitSha) {
              throw new Error('В ветке появились новые коммиты — перезагрузите страницу');
            }

            var content = JSON.stringify(state.config, null, 2) + '\n';
            var blobRes = await fetch('https://api.github.com/repos/' + repo + '/git/blobs', {
              method: 'POST',
              headers: headers,
              body: JSON.stringify({ content: content, encoding: 'utf-8' })
            });
            if (!blobRes.ok) throw new Error('Ошибка создания blob в GitHub');
            var blobJson = await blobRes.json();

            var treeRes = await fetch('https://api.github.com/repos/' + repo + '/git/trees', {
              method: 'POST',
              headers: headers,
              body: JSON.stringify({
                base_tree: state.ghHeadTreeSha,
                tree: [{ path: 'data/sidebar.json', mode: '100644', type: 'blob', sha: blobJson.sha }]
              })
            });
            if (!treeRes.ok) throw new Error('Ошибка создания Git tree');
            var treeJson = await treeRes.json();

            var commitMsg = document.getElementById('saveCommitMsg').value.trim() || 'feat(sidebar): update left sidebar configuration';
            var commitRes = await fetch('https://api.github.com/repos/' + repo + '/git/commits', {
              method: 'POST',
              headers: headers,
              body: JSON.stringify({ message: commitMsg, tree: treeJson.sha, parents: [state.ghHeadCommitSha] })
            });
            if (!commitRes.ok) throw new Error('Ошибка создания коммита');
            var commitJson = await commitRes.json();

            var patchRes = await fetch('https://api.github.com/repos/' + repo + '/git/refs/heads/' + encodeURIComponent(branch), {
              method: 'PATCH',
              headers: headers,
              body: JSON.stringify({ sha: commitJson.sha, force: false })
            });
            if (!patchRes.ok) throw new Error('Ошибка обновления ветки (HTTP ' + patchRes.status + ')');

            document.getElementById('saveModalBackdrop').classList.remove('is-open');
            showToast('Создан коммит ' + commitJson.sha.slice(0, 7));
            await loadFromGithub();
          }
        } catch (err) {
          statusEl.textContent = 'Ошибка: ' + err.message;
          btn.disabled = false;
        }
      }

      /* ---------- Init & Event Wiring ---------- */
      var pvLangSel = document.getElementById('pvLangSelect');
      SITE_LANGUAGES.forEach(function (l) { pvLangSel.appendChild(new Option(l.label, l.code)); });
      pvLangSel.value = state.previewLang;
      pvLangSel.addEventListener('change', function () {
        state.previewLang = this.value;
        renderLivePreview();
        if (state.activeTab === 'menu') renderMenuTab();
      });

      document.getElementById('pvThemeBtn').addEventListener('click', function () {
        state.previewDark = !state.previewDark;
        this.textContent = state.previewDark ? 'Светлая тема' : 'Тёмная тема';
        renderLivePreview();
      });

      document.querySelectorAll('.tab-btn[data-tab]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tab-btn[data-tab]').forEach(function (b) { b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          state.activeTab = btn.getAttribute('data-tab');
          renderActiveTab();
        });
      });

      document.getElementById('resetDefaultBtn').addEventListener('click', function () {
        state.config = buildDefaultConfig();
        onMutate();
        renderActiveTab();
        showToast('Загружены стандартные настройки (нажмите «Сохранить изменения» для записи)');
      });

      document.getElementById('ioModalBtn').addEventListener('click', function () {
        document.getElementById('ioStatus').textContent = '';
        refreshIoModal();
        document.getElementById('ioModalBackdrop').classList.add('is-open');
      });
      document.getElementById('ioCloseBtn').addEventListener('click', function () {
        document.getElementById('ioModalBackdrop').classList.remove('is-open');
      });
      document.querySelectorAll('.tab-btn[data-iomode]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tab-btn[data-iomode]').forEach(function (b) { b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          state.ioMode = btn.getAttribute('data-iomode');
          if (state.ioMode === 'import') document.getElementById('ioTextarea').value = '';
          refreshIoModal();
        });
      });
      document.getElementById('ioTextarea').addEventListener('input', function () {
        if (state.ioMode === 'import') updateImportSummary();
      });
      document.getElementById('ioFileInput').addEventListener('change', function () {
        var f = this.files && this.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function () {
          document.getElementById('ioTextarea').value = String(r.result || '');
          updateImportSummary();
        };
        r.readAsText(f, 'utf-8');
      });
      document.getElementById('ioCopyBtn').addEventListener('click', function () {
        var ta = document.getElementById('ioTextarea');
        navigator.clipboard.writeText(ta.value).then(function () {
          document.getElementById('ioStatus').textContent = 'Скопировано в буфер обмена';
        }).catch(function () {
          ta.select();
          document.execCommand('copy');
          document.getElementById('ioStatus').textContent = 'Скопировано';
        });
      });
      document.getElementById('ioDownloadBtn').addEventListener('click', function () {
        var text = document.getElementById('ioTextarea').value;
        var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'sidebar-config.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
      document.getElementById('ioApplyBtn').addEventListener('click', function () {
        try {
          state.config = parseImportedPackage(document.getElementById('ioTextarea').value);
          document.getElementById('ioModalBackdrop').classList.remove('is-open');
          onMutate();
          renderActiveTab();
          showToast('Пакет настроек импортирован — проверьте и сохраните изменения');
        } catch (err) {
          document.getElementById('ioStatus').textContent = 'Ошибка: ' + err.message;
        }
      });

      document.getElementById('saveBtn').addEventListener('click', openSaveModal);
      document.getElementById('saveCloseBtn').addEventListener('click', function () {
        document.getElementById('saveModalBackdrop').classList.remove('is-open');
      });
      document.getElementById('saveCancelBtn').addEventListener('click', function () {
        document.getElementById('saveModalBackdrop').classList.remove('is-open');
      });
      document.getElementById('saveConfirmBtn').addEventListener('click', confirmSave);

      document.getElementById('ghConnectBtn').addEventListener('click', function () {
        loadFromGithub().catch(function (err) {
          document.getElementById('ghAuthStatus').textContent = 'Ошибка: ' + err.message;
        });
      });
      document.getElementById('ghFromDecapBtn').addEventListener('click', function () {
        var decap = readDecapToken();
        if (decap && decap.token) {
          state.ghToken = decap.token;
          loadFromGithub().catch(function (err) {
            document.getElementById('ghAuthStatus').textContent = 'Ошибка: ' + err.message;
          });
        } else {
          document.getElementById('ghAuthStatus').textContent = 'Сессия Decap CMS не найдена';
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          document.getElementById('ioModalBackdrop').classList.remove('is-open');
          document.getElementById('saveModalBackdrop').classList.remove('is-open');
        }
      });

      loadState();
    })();
  </script>
</body>
</html>
