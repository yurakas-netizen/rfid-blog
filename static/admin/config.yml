backend:
  name: github
  repo: yurakas-netizen/rfid-blog
  branch: master

media_folder: "static/images"
public_folder: "/images"

i18n:
  structure: multiple_files
  locales: [uk, en, da, de, fr, ru]
  default_locale: uk

collections:
  - name: "post"
    label: "Статьи"
    folder: "content/post"
    create: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
   - { label: "Заголовок", name: "title", widget: "string", required: false, i18n: true }
   - { label: "Описание", name: "description", widget: "string", required: false, i18n: true }
   - { label: "Дата", name: "date", widget: "datetime", i18n: duplicate }
   - { label: "Обложка", name: "image", widget: "image", required: false, i18n: duplicate }
   - { label: "Категории", name: "categories", widget: "list", required: false, i18n: true }
   - { label: "Теги", name: "tags", widget: "list", required: false, i18n: true }
   - { label: "Текст статьи", name: "body", widget: "markdown", required: false, i18n: true }

