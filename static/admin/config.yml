backend:
  name: github
  repo: yurakas-netizen/rfid-blog
  branch: master

locale: ru
media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "post_uk"
    label: "Статьи (UA)"
    folder: "content/uk/post"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Описание", name: "description", widget: "string", required: false }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Обложка (верхний баннер)", name: "image", widget: "image", required: false, hint: "Только для карточки и шапки статьи. Графики, схемы и фото внутри текста добавляйте ниже в редакторе." }
      - { label: "Категории", name: "categories", widget: "list", required: false }
      - { label: "Теги", name: "tags", widget: "list", required: false }
      - { label: "Текст статьи", name: "body", widget: "markdown", modes: ["rich_text", "raw"], hint: "Чтобы вставить график, схему или фото в нужное место текста: нажмите «+» → «Изображение» (или «Два графика в ряд»), либо просто перетащите файл в текст." }

