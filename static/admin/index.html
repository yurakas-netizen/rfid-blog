<!doctype html>
<html>
<head>
  <meta charset="utf-8" />

  <title>RFID Ukraine — CMS</title>
  <link href="/admin/config.yml?v=20261125-slug" type="text/yaml" rel="cms-config-url" />
  <style>
    .rfid-cms-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3px;
      padding: 6px 10px;
      background: #f8fafc;
      border-top: 1px solid #dfdfe3;
      border-bottom: 1px solid #dfdfe3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .rfid-cms-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .rfid-cms-btn:hover:not(:disabled) {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .rfid-cms-btn.is-active {
      background: #e0f2fe;
      color: #0369a1;
      border-color: #7dd3fc;
    }

    .rfid-cms-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .rfid-cms-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .rfid-cms-sep {
      width: 1px;
      height: 18px;
      background: #cbd5e1;
      margin: 0 4px;
    }

    .rfid-cms-findbar {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: #f1f5f9;
      border-bottom: 1px solid #dfdfe3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .rfid-cms-findbar.is-open {
      display: flex;
    }

    .rfid-cms-findbar input {
      height: 28px;
      padding: 0 9px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 12.5px;
      color: #0f172a;
      background: #ffffff;
      outline: none;
      min-width: 150px;
    }

    .rfid-cms-findbar input:focus {
      border-color: #0284c7;
    }

    .rfid-cms-find-status {
      font-size: 11.5px;
      color: #64748b;
      margin-left: 4px;
    }

    /* Top bar Import / Export group */
    .rfid-io-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 10px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .rfid-io-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;

    .rfid-io-btn:hover {
      background: #f1f5f9;

    }

    .rfid-io-btn svg {
      width: 15px;
      height: 15px;

    }

    /* Modal */
    .rfid-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .rfid-modal-backdrop.is-open {
      display: flex;
    }

    .rfid-modal {
      width: min(92vw, 760px);
      max-width: 760px;
      max-height: 90vh;
      background: #ffffff;
      color: #0f172a;
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.32);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .rfid-modal.is-wide {
      width: min(92vw, 920px);
      max-width: 920px;
    }

    .rfid-modal.is-registry {
      width: 96vw;
      max-width: 1520px;
      height: 92vh;
      max-height: 92vh;
    }

    .rfid-registry-frame {
      width: 100%;
      flex: 1 1 auto;
      border: 0;
      background: #f8fafc;
    }

    .rfid-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #e2e8f0;
    }

    .rfid-modal-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .rfid-modal-close {
      border: 0;
      background: transparent;
      font-size: 22px;
      line-height: 1;
      color: #64748b;
      cursor: pointer;
      padding: 2px 6px;
    }

    .rfid-modal-close:hover {

    }

    .rfid-modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rfid-modal-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .rfid-modal-tabs {
      display: inline-flex;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      overflow: hidden;
    }

    .rfid-modal-tab {
      border: 0;
      background: #f8fafc;
      color: #475569;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .rfid-modal-tab.is-active {
      background: #0284c7;
      color: #ffffff;
    }

    .rfid-modal-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #334155;
      cursor: pointer;
      user-select: none;
    }

    .rfid-modal-textarea {
      width: 100%;
      min-height: 290px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      color: #0f172a;
      background: #f8fafc;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }

    .rfid-modal-textarea:focus {
      border-color: #0284c7;
      background: #ffffff;
    }

    .rfid-modal-textarea.is-code {
      min-height: 360px;
      height: 48vh;
      max-height: 62vh;
      tab-size: 2;
      -moz-tab-size: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .rfid-modal-textarea.is-code.is-nowrap {
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
    }

    .rfid-modal-hint {
      font-size: 12px;
      color: #64748b;
      margin-left: auto;
    }

    .rfid-modal-summary {
      padding: 9px 12px;
      border-radius: 7px;

      border: 1px solid #e2e8f0;

      color: #334155;

    .rfid-modal-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;

      border-top: 1px solid #e2e8f0;

    }

    .rfid-btn-primary {
      height: 36px;
      padding: 0 16px;
      border-radius: 7px;
      border: 0;
      background: #0284c7;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .rfid-btn-primary:hover {
      background: #0369a1;
    }

    .rfid-btn-secondary {
      height: 36px;
      padding: 0 14px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .rfid-btn-secondary:hover {
      background: #f1f5f9;
    }

    .rfid-modal-status {
      font-size: 12.5px;
      color: #0369a1;
      font-weight: 600;
    }
  </style>

<body>
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  <script>
    (function () {
      /* =========================================================
         1. Two-Charts Side-by-Side Component
         ========================================================= */
      if (window.CMS) {
        window.CMS.registerEditorComponent({
          id: 'charts-pair',
          label: 'Два графика / фото в ряд',
          fields: [
            { name: 'img1', label: 'Левый график / фото', widget: 'image' },
            { name: 'alt1', label: 'Подпись слева', widget: 'string', required: false },
            { name: 'img2', label: 'Правый график / фото', widget: 'image' },
            { name: 'alt2', label: 'Подпись справа', widget: 'string', required: false }
          ],
          pattern: /^!\[([^\]]*)\]\(([^\s")]+)\)\s+!\[([^\]]*)\]\(([^\s")]+)\)$/,
          fromBlock: function (match) {
            return {
              alt1: match[1] || '',
              img1: match[2] || '',
              alt2: match[3] || '',
              img2: match[4] || ''
            };
          },
          toBlock: function (data) {
            var a1 = (data.alt1 || '').replace(/[\[\]]/g, '');
            var a2 = (data.alt2 || '').replace(/[\[\]]/g, '');
            return '![' + a1 + '](' + (data.img1 || '') + ') ![' + a2 + '](' + (data.img2 || '') + ')';
          },
          toPreview: function (data) {
            return (
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;">' +
                '<figure style="margin:0;text-align:center;"><img src="' + (data.img1 || '') + '" alt="' + (data.alt1 || '') + '" style="max-width:100%;border-radius:8px;" />' + (data.alt1 ? '<figcaption style="font-size:12px;color:#64748b;margin-top:4px;">' + data.alt1 + '</figcaption>' : '') + '</figure>' +
                '<figure style="margin:0;text-align:center;"><img src="' + (data.img2 || '') + '" alt="' + (data.alt2 || '') + '" style="max-width:100%;border-radius:8px;" />' + (data.alt2 ? '<figcaption style="font-size:12px;color:#64748b;margin-top:4px;">' + data.alt2 + '</figcaption>' : '') + '</figure>' +
              '</div>'
            );
          }
        });

        /* Raw HTML / CSS / JS shortcode block (Hugo {{< rawhtml >}}...{{< /rawhtml >}}) */
        window.CMS.registerEditorComponent({
          id: 'rawhtml',
          label: 'HTML-блок (rawhtml)',
          fields: [
            {
              name: 'html',
              label: 'HTML / CSS / JS код',
              widget: 'text',
              required: false
            }
          ],
          pattern: /^\{\{<\s*rawhtml\s*>\}\}([\s\S]*?)\{\{<\s*\/rawhtml\s*>\}\}[ \t]*(?=\r?\n|$)/,
          fromBlock: function (match) {
            var raw = match && match[1] ? String(match[1]) : '';
            return {
              html: raw.replace(/^\r?\n|\r?\n$/g, '')
            };
          },
          toBlock: function (data) {
            var code = String((data && data.html) || '').replace(/^\r?\n|\r?\n$/g, '');
            return '{{< rawhtml >}}\n' + code + '\n{{< /rawhtml >}}';
          },
          toPreview: function (data) {
            var code = String((data && data.html) || '').trim();
            if (!code) {
              return '<div style="padding:10px 14px;border:1px dashed #94a3b8;border-radius:8px;background:#f8fafc;color:#475569;font-size:12.5px;">&lt;/&gt; Пустой HTML-блок (rawhtml)</div>';
            }
            var scriptRe = new RegExp('<script\\b[^>]*>[\\s\\S]*?<\\/' + 'script>', 'gi');
            var styleRe = new RegExp('<style\\b[^>]*>[\\s\\S]*?<\\/' + 'style>', 'gi');
            var scriptCount = 0;
            var safePreview = code.replace(scriptRe, function () {
              scriptCount++;
              return '';
            }).trim();
            var scriptBadge = scriptCount > 0
              ? '<div style="margin-top:8px;padding:6px 10px;border-radius:6px;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;font-size:12px;">&lt;script&gt; (' + scriptCount + '): выполнится на опубликованной странице Hugo</div>'
              : '';
            var onlyStylesOrHidden = !safePreview.replace(styleRe, '').trim();
            var fallbackNotice = onlyStylesOrHidden && scriptCount === 0
              ? '<div style="padding:8px 12px;border-radius:6px;background:#f1f5f9;border:1px dashed #94a3b8;color:#475569;font-size:12px;">&lt;/&gt; Скрытый HTML/CSS-блок (rawhtml)</div>'
              : '';
            return (
              '<div class="rfid-rawhtml-preview" style="margin:10px 0;">' +
                safePreview +
                fallbackNotice +
                scriptBadge +
              '</div>'
            );
          }
        });

        /* Preserve $...$ and $$...$$ LaTeX math verbatim across Rich Text <-> Markdown */
        if (typeof window.CMS.registerRemarkPlugin === 'function') {
          window.CMS.registerRemarkPlugin(function rfidMathRemarkPlugin() {
            var Parser = this.Parser;
            if (!Parser || !Parser.prototype || !Parser.prototype.inlineTokenizers) return;
            var inlineTokenizers = Parser.prototype.inlineTokenizers;
            var inlineMethods = Parser.prototype.inlineMethods;

            function mathInlineTokenizer(eat, value, silent) {
              if (!value || value.charAt(0) !== '$') return;
              var isDouble = value.charAt(1) === '$';
              var delim = isDouble ? '$$' : '$';
              var start = delim.length;
              if (!isDouble) {
                if (value.length <= 1 || /\s/.test(value.charAt(1))) return;
              }
              var end = -1;
              for (var i = start; i < value.length; i++) {
                if (value.charAt(i) === '\\') {
                  i++;
                  continue;
                }
                if (isDouble) {
                  if (value.charAt(i) === '$' && value.charAt(i + 1) === '$') {
                    end = i;
                    break;
                  }
                } else {
                  if (value.charAt(i) === '\n') return;
                  if (value.charAt(i) === '$' && !/\s/.test(value.charAt(i - 1))) {
                    end = i;
                    break;
                  }
                }
              }
              if (end === -1 || end === start) return;
              var fullMatch = value.slice(0, end + delim.length);
              var inner = value.slice(start, end);
              if (!isDouble && /^\d[\d.,\s]*$/.test(inner.trim())) return;
              if (silent) return true;
              return eat(fullMatch)({
                type: 'text',
                value: fullMatch
              });
            }

            mathInlineTokenizer.locator = function (value, fromIndex) {
              return value.indexOf('$', fromIndex);
            };

            inlineTokenizers.rfidMath = mathInlineTokenizer;
            if (Array.isArray(inlineMethods) && inlineMethods.indexOf('rfidMath') === -1) {
              var escapeIdx = inlineMethods.indexOf('escape');
              if (escapeIdx !== -1) {
                inlineMethods.splice(escapeIdx, 0, 'rfidMath');
              } else {
                inlineMethods.unshift('rfidMath');
              }
            }
          });
        }
      }

      /* =========================================================
         2. React Fiber Helpers
         ========================================================= */
      function getFiber(el) {
        if (!el) return null;
        var keys = Object.keys(el);
        for (var i = 0; i < keys.length; i++) {
          if (keys[i].indexOf('__reactFiber$') === 0 || keys[i].indexOf('__reactInternalInstance$') === 0) {
            return el[keys[i]];
          }
        }
        return null;
      }

      function findSlateEditor(slateEl) {
        var fiber = getFiber(slateEl);
        var steps = 0;
        while (fiber && steps < 30) {
          var p = fiber.memoizedProps || fiber.pendingProps;
          if (p) {
            if (p.editor && typeof p.editor.undo === 'function') return p.editor;
            if (p.value && typeof p.value.undo === 'function') return p.value;
          }
          fiber = fiber.return;
          steps++;
        }
        return null;
      }

      function findToolbarProps(controlBar) {
        if (!controlBar) return null;
        var candidate = controlBar.querySelector('button') || controlBar.firstElementChild || controlBar;
        var fiber = getFiber(candidate);
        var steps = 0;
        while (fiber && steps < 30) {
          var p = fiber.memoizedProps || fiber.pendingProps;
          if (p && typeof p.onToggleMode === 'function' && ('rawMode' in p || 'onMarkClick' in p)) {
            return p;
          }
          fiber = fiber.return;
          steps++;
        }
        return null;
      }

      function findEditorContext() {
        var nodes = document.querySelectorAll('[class*="ToolbarContainer"], [class*="EditorContainer"], [data-slate-editor="true"], input[id^="title-field-"]');
        for (var k = 0; k < nodes.length; k++) {
          var fiber = getFiber(nodes[k]);
          var steps = 0;
          while (fiber && steps < 60) {
            var p = fiber.memoizedProps || fiber.pendingProps;
            if (p && p.entry && p.fields && typeof p.onChange === 'function' && typeof p.entry.get === 'function') {
              return { props: p };
            }
            if (fiber.stateNode && typeof fiber.stateNode.handleChangeDraftField === 'function' && fiber.stateNode.props && fiber.stateNode.props.entryDraft) {
              var ep = fiber.stateNode.props;
              return {
                props: {
                  entry: ep.entryDraft.get('entry'),
                  fields: ep.fields,
                  collection: ep.collection,
                  onChange: fiber.stateNode.handleChangeDraftField
                }
              };
            }
            fiber = fiber.return;
            steps++;
          }
        }
        return null;
      }

      function findMarkdownControlInstances() {
        var result = [];
        var editors = document.querySelectorAll('[data-slate-editor="true"]');
        for (var i = 0; i < editors.length; i++) {
          var fiber = getFiber(editors[i]);
          var steps = 0;
          while (fiber && steps < 40) {
            var inst = fiber.stateNode;
            if (inst && typeof inst.handleMode === 'function' && inst.state && inst.state.mode) {
              result.push(inst);
              break;
            }
            fiber = fiber.return;
            steps++;
          }
        }
        return result;
      }

      function findListControlInstance(fieldName) {
        var input = document.querySelector('input[id^="' + fieldName + '-field-"]');
        if (!input) return null;
        var fiber = getFiber(input);
        var steps = 0;
        while (fiber && steps < 20) {
          var inst = fiber.stateNode;
          if (inst && typeof inst.handleChange === 'function' && typeof inst.valueToString === 'function') {
            return { inst: inst, input: input };
          }
          fiber = fiber.return;
          steps++;
        }
        return { inst: null, input: input };
      }

      function getPlugin(toolbarProps, id) {
        if (!toolbarProps || !toolbarProps.plugins) return null;
        var plugins = toolbarProps.plugins;
        if (typeof plugins.get === 'function' && plugins.get(id)) {
          return plugins.get(id);
        }
        var list = typeof plugins.toArray === 'function' ? plugins.toArray() : Array.isArray(plugins) ? plugins : [];
        for (var i = 0; i < list.length; i++) {
          if (list[i] && list[i].id === id) return list[i];
        }
        return null;
      }

      /* =========================================================
         3. Enhanced Markdown / Rich-Text Toolbar
         ========================================================= */
      function makeBtn(opts) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'rfid-cms-btn';
        btn.title = opts.title;
        btn.setAttribute('aria-label', opts.title);
        btn.innerHTML = opts.icon + (opts.label ? '<span>' + opts.label + '</span>' : '');
        btn.addEventListener('mousedown', function (e) {
          e.preventDefault();
        });
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          opts.onClick(e, btn);
        });
        return btn;
      }

      function makeSep() {
        var sep = document.createElement('span');
        sep.className = 'rfid-cms-sep';
        return sep;
      }

      function attachToolbar(controlBar) {
        if (!controlBar || controlBar.dataset.rfidToolbarAttached === '1') return;
        var wrapper = controlBar.parentElement;
        if (!wrapper) return;
        var slateEl = wrapper.querySelector('[data-slate-editor="true"]');
        if (!slateEl) return;

        controlBar.dataset.rfidToolbarAttached = '1';

        var bar = document.createElement('div');
        bar.className = 'rfid-cms-toolbar';

        var findBar = document.createElement('div');
        findBar.className = 'rfid-cms-findbar';

        var findInput = document.createElement('input');
        findInput.type = 'text';
        findInput.placeholder = 'Найти в тексте...';

        var replaceInput = document.createElement('input');
        replaceInput.type = 'text';
        replaceInput.placeholder = 'Заменить на...';

        var findStatus = document.createElement('span');
        findStatus.className = 'rfid-cms-find-status';

        function focusSlate() {
          var liveSlate = wrapper.querySelector('[data-slate-editor="true"]') || slateEl;
          liveSlate.focus();
        }

        function getCtx() {
          var liveSlate = wrapper.querySelector('[data-slate-editor="true"]') || slateEl;
          return {
            slateEl: liveSlate,
            editor: findSlateEditor(liveSlate),
            tb: findToolbarProps(controlBar)
          };
        }

        function refreshState() {
          var ctx = getCtx();
          var ed = ctx.editor;
          var tb = ctx.tb;
          var isRaw = !!(tb && tb.rawMode);

          if (ed && ed.history) {
            undoBtn.disabled = !(ed.history.undos && ed.history.undos.length > 0);
            redoBtn.disabled = !(ed.history.redos && ed.history.redos.length > 0);
          } else {
            undoBtn.disabled = true;
            redoBtn.disabled = true;
          }

          clearBtn.disabled = isRaw;
          imgBtn.disabled = isRaw;
          pairBtn.disabled = isRaw;
          if (tb && typeof tb.hasMark === 'function' && !isRaw) {
            strikeBtn.classList.toggle('is-active', !!tb.hasMark('delete'));
          } else {
            strikeBtn.classList.remove('is-active');
          }
        }

        var undoBtn = makeBtn({
          title: 'Отменить (Ctrl+Z)',
          label: 'Отменить',
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></svg>',
          onClick: function () {
            var ctx = getCtx();
            if (ctx.editor && typeof ctx.editor.undo === 'function') {
              ctx.slateEl.focus();
              ctx.editor.undo();
              requestAnimationFrame(refreshState);
            }
          }
        });

        var redoBtn = makeBtn({
          title: 'Повторить (Ctrl+Y)',
          label: 'Повторить',

        function selectMatch(fromStart) {
          var q = findInput.value;
          if (!q) {
            findStatus.textContent = '';
            return false;
          }
          var ctx = getCtx();
          var walker = document.createTreeWalker(ctx.slateEl, NodeFilter.SHOW_TEXT);
          var qLower = q.toLowerCase();
          var nodes = [];
          var n;
          while ((n = walker.nextNode())) {
            if (n.nodeValue && n.nodeValue.length > 0) nodes.push(n);
          }

          var sel = window.getSelection();
          var startIdx = 0;
          var startOffset = 0;
          if (!fromStart && sel && sel.rangeCount > 0) {
            var cur = sel.getRangeAt(0);
            for (var i = 0; i < nodes.length; i++) {
              if (nodes[i] === cur.endContainer) {
                startIdx = i;
                startOffset = cur.endOffset;
                break;
              }
            }
          }

          for (var pass = 0; pass < 2; pass++) {
            var iBegin = pass === 0 ? startIdx : 0;
            var iEnd = pass === 0 ? nodes.length : startIdx + 1;
            for (var j = iBegin; j < iEnd; j++) {
              var text = nodes[j].nodeValue;
              var offset = pass === 0 && j === startIdx ? startOffset : 0;
              var hit = text.toLowerCase().indexOf(qLower, offset);
              if (hit !== -1) {
                ctx.slateEl.focus({ preventScroll: true });
                var range = document.createRange();
                range.setStart(nodes[j], hit);
                range.setEnd(nodes[j], hit + q.length);
                sel.removeAllRanges();
                sel.addRange(range);
                if (nodes[j].parentElement) {
                  nodes[j].parentElement.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }
                findStatus.textContent = 'Найдено';
                return true;
              }
            }
          }
          findStatus.textContent = 'Не найдено';
          return false;
        }

      /* =========================================================
         4. Article Import / Export (All Fields Except Images)
         ========================================================= */
      function stripBodyImages(md) {
        return String(md || '')
          .replace(/!\[[^\]]*\]\([^)]*\)\s*/g, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      function stripQuotes(s) {
        var str = String(s || '').trim();
        if (str.length >= 2 && str[0] === '"' && str[str.length - 1] === '"') {
          try {
            return JSON.parse(str);
          } catch (_) {
            return str.slice(1, -1).replace(/\\"/g, '"').replace(/\\n/g, '\n');
          }
        }
        if (str.length >= 2 && str[0] === "'" && str[str.length - 1] === "'") {
          return str.slice(1, -1).replace(/''/g, "'");
        }
        return str;
      }

      function normalizeIsoDate(val) {
        if (!val) return '';
        if (val instanceof Date) {
          return isNaN(val.getTime()) ? '' : val.toISOString();
        }
        if (typeof val === 'object') {
          if (typeof val.toDate === 'function') {
            var dObj = val.toDate();
            return dObj && !isNaN(dObj.getTime()) ? dObj.toISOString() : '';
          }
          if (typeof val.toISOString === 'function') {
            try { return val.toISOString(); } catch (_) {}
          }
        }
        var str = String(val).trim();
        if (!str) return '';
        var parsed = new Date(str);
        if (!isNaN(parsed.getTime())) {
          return parsed.toISOString();
        }
        return str;
      }

      function formatYamlListItem(val) {
        var str = String(val);
        return /[:#\[\]{}&*!|>'"%@`,?]|^-|^\s|\s$/.test(str) ? JSON.stringify(str) : str;
      }

      function serializeMarkdownArticle(data, stripInlineImages) {
        var lines = ['---'];
        lines.push('title: ' + JSON.stringify(String(data.title || '')));
        if (data.slug) {
          lines.push('slug: ' + JSON.stringify(String(data.slug).trim()));
        }
        if (data.description) {
          lines.push('description: ' + JSON.stringify(String(data.description)));
        }
        var isoDate = normalizeIsoDate(data.date);
        if (isoDate) {
          lines.push('date: ' + isoDate);
        }
        if (data.translationKey) {
          lines.push('translationKey: ' + JSON.stringify(String(data.translationKey).trim()));
        }
        if (Array.isArray(data.categories) && data.categories.length > 0) {
          lines.push('categories:');
          data.categories.forEach(function (c) {
            lines.push('  - ' + formatYamlListItem(c));
          });
        }
        if (Array.isArray(data.tags) && data.tags.length > 0) {
          lines.push('tags:');
          data.tags.forEach(function (t) {
            lines.push('  - ' + formatYamlListItem(t));
          });
        }
        lines.push('---');
        var body = stripInlineImages ? stripBodyImages(data.body) : String(data.body || '');
        if (body) lines.push(body);
        return lines.join('\n') + '\n';
      }

      function serializeJsonArticle(data, stripInlineImages) {
        var payload = {
          title: String(data.title || ''),
          slug: String(data.slug || '').trim(),
          description: String(data.description || ''),
          date: normalizeIsoDate(data.date),
          translationKey: String(data.translationKey || '').trim(),
          categories: Array.isArray(data.categories) ? data.categories : [],
          tags: Array.isArray(data.tags) ? data.tags : [],
          body: stripInlineImages ? stripBodyImages(data.body) : String(data.body || '')
        };
        return JSON.stringify(payload, null, 2) + '\n';
      }

      function parseYamlFrontmatter(yamlText) {
        var lines = yamlText.replace(/\r\n/g, '\n').split('\n');
        var out = {};
        var i = 0;

        while (i < lines.length) {
          var line = lines[i];
          if (!line.trim() || line.trim()[0] === '#') {
            i++;
            continue;
          }
          var m = line.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
          if (!m) {
            i++;
            continue;
          }
          var key = m[1];
          var rest = m[2];

          if (rest === '|' || rest === '|-' || rest === '>' || rest === '>-') {
            var block = [];
            i++;
            while (i < lines.length && (/^\s+/.test(lines[i]) || lines[i] === '')) {
              block.push(lines[i].replace(/^\s{2}/, ''));
              i++;
            }
            out[key] = block.join(rest[0] === '>' ? ' ' : '\n').trim();
            continue;
          }

          if (rest.trim() === '') {
            var arr = [];
            var j = i + 1;
            while (j < lines.length && /^\s*-\s+/.test(lines[j])) {
              arr.push(stripQuotes(lines[j].replace(/^\s*-\s+/, '')));
              j++;
            }
            if (arr.length > 0) {
              out[key] = arr;
              i = j;
              continue;
            }
            out[key] = '';
            i++;
            continue;
          }

          var trimmed = rest.trim();
          if (trimmed[0] === '[' && trimmed[trimmed.length - 1] === ']') {
            var inner = trimmed.slice(1, -1).trim();
            out[key] = inner
              ? inner.split(',').map(function (x) { return stripQuotes(x); }).filter(Boolean)
              : [];
            i++;
            continue;
          }

          // Handle multi-line quoted or folded scalar continuation
          var valParts = [rest];
          var k = i + 1;
          var startsQuote = trimmed[0] === '"' && !(trimmed.length > 1 && trimmed[trimmed.length - 1] === '"' && trimmed[trimmed.length - 2] !== '\\');
          while (k < lines.length && /^\s+/.test(lines[k]) && !/^\s*-\s+/.test(lines[k])) {
            valParts.push(lines[k].trim());
            var joined = valParts.join(' ');
            k++;
            if (startsQuote && /[^\\]"$/.test(joined.trim())) break;
          }
          out[key] = stripQuotes(valParts.join(' '));
          i = k;
        }
        return out;
      }

      function parseImportedArticle(rawText) {
        var text = String(rawText || '').replace(/^\uFEFF/, '');
        var trimmed = text.trim();
        if (!trimmed) {
          throw new Error('Пустой файл или текст');
        }

        if (trimmed[0] === '{') {
          var obj = JSON.parse(trimmed);
          return {
            hasTitle: typeof obj.title === 'string',
            title: typeof obj.title === 'string' ? obj.title : '',
            hasSlug: typeof obj.slug === 'string' && obj.slug.trim().length > 0,
            slug: typeof obj.slug === 'string' ? obj.slug.trim() : '',
            hasDescription: typeof obj.description === 'string',
            description: typeof obj.description === 'string' ? obj.description : '',
            hasDate: Boolean(obj.date),
            date: obj.date ? String(obj.date) : '',
            hasTranslationKey: typeof obj.translationKey === 'string',
            translationKey: typeof obj.translationKey === 'string' ? obj.translationKey : '',
            hasCategories: Array.isArray(obj.categories),
            categories: Array.isArray(obj.categories) ? obj.categories.map(String).filter(Boolean) : [],
            hasTags: Array.isArray(obj.tags),
            tags: Array.isArray(obj.tags) ? obj.tags.map(String).filter(Boolean) : [],
            hasBody: typeof obj.body === 'string',
            body: typeof obj.body === 'string' ? obj.body : ''
          };
        }

        var fmMatch = text.match(/^\s*---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
        if (fmMatch) {
          var meta = parseYamlFrontmatter(fmMatch[1]);
          var body = (fmMatch[2] || '').replace(/^\r?\n/, '');
          var cats = Array.isArray(meta.categories)
            ? meta.categories
            : (typeof meta.categories === 'string' && meta.categories ? meta.categories.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : []);
          var tags = Array.isArray(meta.tags)
            ? meta.tags
            : (typeof meta.tags === 'string' && meta.tags ? meta.tags.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : []);
          return {
            hasTitle: typeof meta.title === 'string' && meta.title.length > 0,
            title: typeof meta.title === 'string' ? meta.title : '',
            hasSlug: typeof meta.slug === 'string' && meta.slug.trim().length > 0,
            slug: typeof meta.slug === 'string' ? meta.slug.trim() : '',
            hasDescription: typeof meta.description === 'string',
            description: typeof meta.description === 'string' ? meta.description : '',
            hasDate: Boolean(meta.date),
            date: meta.date ? String(meta.date) : '',
            hasTranslationKey: typeof meta.translationKey === 'string' && meta.translationKey.length > 0,
            translationKey: typeof meta.translationKey === 'string' ? meta.translationKey : '',
            hasCategories: 'categories' in meta,
            categories: cats,
            hasTags: 'tags' in meta,
            tags: tags,
            hasBody: true,
            body: body
          };
        }

        // Plain markdown fallback (extract optional # H1 if first line)
        return {
          hasTitle: false,
          title: '',
          hasSlug: false,
          slug: '',
          hasDescription: false,
          description: '',
          hasDate: false,
          date: '',
          hasTranslationKey: false,
          translationKey: '',
          hasCategories: false,
          categories: [],
          hasTags: false,
          tags: [],
          hasBody: true,
          body: text
        };
      }

      function toLatinSlug(text) {
        var map = {
          'а':'a','б':'b','в':'v','г':'g','ґ':'g','д':'d','е':'e','ё':'yo','є':'ye',
          'ж':'zh','з':'z','и':'i','і':'i','ї':'yi','й':'y','к':'k','л':'l','м':'m',
          'н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh',
          'ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',
          'æ':'ae','ø':'o','å':'a','ß':'ss','ł':'l','đ':'d','ð':'d','þ':'th'
        };
        var lower = String(text || '').toLowerCase();
        var out = '';
        for (var i = 0; i < lower.length; i++) {
          var ch = lower[i];
          if (Object.prototype.hasOwnProperty.call(map, ch)) {
            out += map[ch];
          } else {
            out += ch;
          }
        }
        out = out.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        out = out
          .replace(/['’ʼ`]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .replace(/-{2,}/g, '-');
        if (out.length > 80) {
          var cut = out.slice(0, 80);
          var lastDash = cut.lastIndexOf('-');
          out = (lastDash > 40 ? cut.slice(0, lastDash) : cut).replace(/-+$/g, '');
        }
        return out;
      }

      function slugFileName(title, ext) {
        var base = toLatinSlug(title) || 'article';
        return base + '.' + ext;
      }

      function readCurrentEntryData() {
        var ctx = findEditorContext();
        if (!ctx || !ctx.props || !ctx.props.entry) return null;
        var raw = ctx.props.entry.get('data');
        var js = raw && typeof raw.toJS === 'function' ? raw.toJS() : {};
        return {
          ctx: ctx.props,
          data: {
            title: js.title || '',
            slug: js.slug || '',
            description: js.description || '',
            date: normalizeIsoDate(js.date) || new Date().toISOString(),
            translationKey: js.translationKey || '',
            categories: Array.isArray(js.categories) ? js.categories : [],
            tags: Array.isArray(js.tags) ? js.tags : [],
            body: js.body || ''
          }
        };
      }

      function applyImportedData(parsed, opts) {
        var ctxWrap = findEditorContext();
        if (!ctxWrap) {
          throw new Error('Редактор статьи не найден');
        }
        var props = ctxWrap.props;
        var fields = props.fields;
        var onChange = props.onChange;

        function getField(name) {
          return fields.find(function (f) { return f.get('name') === name; });
        }

        if (opts.title && parsed.hasTitle) {
          var fTitle = getField('title');
          if (fTitle) onChange(fTitle, parsed.title);
        }

        if (opts.slug) {
          var fSlug = getField('slug');
          if (fSlug) {
            if (parsed.hasSlug) {
              onChange(fSlug, parsed.slug);
            } else if (parsed.hasTitle) {
              var currentData = props.entry && props.entry.get('data');
              var existingSlug = currentData ? String(currentData.get('slug') || '').trim() : '';
              if (!existingSlug) {
                var autoSlug = toLatinSlug(parsed.title);
                if (autoSlug) onChange(fSlug, autoSlug);
              }
            }
          }
        }

        if (opts.description && parsed.hasDescription) {
          var fDesc = getField('description');
          if (fDesc) onChange(fDesc, parsed.description);
        }

        if (opts.date && parsed.hasDate) {
          var fDate = getField('date');
          if (fDate) {
            onChange(fDate, normalizeIsoDate(parsed.date) || parsed.date);
          }
        }

        if (opts.translationKey && parsed.hasTranslationKey) {
          var fTk = getField('translationKey');
          if (fTk) onChange(fTk, parsed.translationKey);
        }

        if (opts.categories && parsed.hasCategories) {
          var fCat = getField('categories');
          var catList = fields.clear().push.apply(fields.clear(), parsed.categories);
          var catCtrl = findListControlInstance('categories');
          if (catCtrl && catCtrl.inst) {
            catCtrl.inst.handleChange({ target: { value: parsed.categories.join(', ') } });
          } else if (fCat) {
            onChange(fCat, catList);
          }
        }

        if (opts.tags && parsed.hasTags) {
          var fTag = getField('tags');
          var tagList = fields.clear().push.apply(fields.clear(), parsed.tags);
          var tagCtrl = findListControlInstance('tags');
          if (tagCtrl && tagCtrl.inst) {
            tagCtrl.inst.handleChange({ target: { value: parsed.tags.join(', ') } });
          } else if (fTag) {
            onChange(fTag, tagList);
          }
        }

        if (opts.body && parsed.hasBody) {
          var fBody = getField('body');
          var bodyText = opts.stripImages ? stripBodyImages(parsed.body) : parsed.body;
          if (fBody) onChange(fBody, bodyText);
          var mdInsts = findMarkdownControlInstances();
          mdInsts.forEach(function (inst) {
            var origMode = inst.state.mode || 'rich_text';
            var tempMode = origMode === 'rich_text' ? 'raw' : 'rich_text';
            try {
              inst.handleMode(tempMode);
              setTimeout(function () {
                try { inst.handleMode(origMode); } catch (_) {}
              }, 35);
            } catch (_) {}
          });
        }
      }

        function refreshExport() {
          var current = readCurrentEntryData();
          if (!current) {
            textarea.value = '';
            summary.textContent = 'Откройте статью для экспорта.';
            return;
          }
          currentTitle = current.data.title || 'article';
          var strip = stripExportCb.checked;
          textarea.value = currentFmt === 'json'
            ? serializeJsonArticle(current.data, strip)
            : serializeMarkdownArticle(current.data, strip);
          summary.textContent =
            'Включены поля: Заголовок, Описание, Дата, Категории (' + current.data.categories.length +
            '), Теги (' + current.data.tags.length + '), Текст статьи (' + current.data.body.length + ' симв.). Обложка (image) исключена.';
        }

        function refreshImportSummary() {
          if (!textarea.value.trim()) {
            summary.textContent = 'Выберите файл .md / .json или вставьте текст с YAML-шапкой (--- ... ---) или JSON. Обложка (image) при импорте не перезаписывается.';
            return;
          }
          try {
            var parsed = parseImportedArticle(textarea.value);
            var parts = [];
            if (parsed.hasTitle) parts.push('Заголовок');
            if (parsed.hasSlug) parts.push('URL-слаг');
            if (parsed.hasDescription) parts.push('Описание');
            if (parsed.hasDate) parts.push('Дата');
            if (parsed.hasTranslationKey) parts.push('Ключ перевода');
            if (parsed.hasCategories) parts.push('Категории (' + parsed.categories.length + ')');
            if (parsed.hasTags) parts.push('Теги (' + parsed.tags.length + ')');
            if (parsed.hasBody) parts.push('Текст (' + parsed.body.length + ' симв.)');
            summary.textContent = 'Распознано: ' + (parts.length ? parts.join(' · ') : 'только текст');
            status.textContent = '';
          } catch (err) {
            summary.textContent = 'Ошибка разбора: ' + err.message;
          }
        }

        tabBtns.forEach(function (b) {
          b.addEventListener('click', function () {
            tabBtns.forEach(function (x) { x.classList.remove('is-active'); });
            b.classList.add('is-active');
            currentFmt = b.dataset.fmt || 'md';
            refreshExport();
          });
        });

        stripExportCb.addEventListener('change', refreshExport);
        textarea.addEventListener('input', function () {
          if (importControls.style.display !== 'none') refreshImportSummary();
        });

        fileInput.addEventListener('change', function () {
          var file = fileInput.files && fileInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            textarea.value = String(reader.result || '');
            refreshImportSummary();
          };
          reader.readAsText(file, 'utf-8');

        copyBtn.addEventListener('click', function () {
          navigator.clipboard.writeText(textarea.value).then(function () {
            status.textContent = 'Скопировано в буфер обмена';
          }).catch(function () {
            textarea.select();
            document.execCommand('copy');
            status.textContent = 'Скопировано';
          });

        downloadBtn.addEventListener('click', function () {
          var blob = new Blob([textarea.value], { type: currentFmt === 'json' ? 'application/json;charset=utf-8' : 'text/markdown;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = slugFileName(currentTitle, currentFmt);
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          status.textContent = 'Файл скачан';

        applyBtn.addEventListener('click', function () {
          try {

            setTimeout(close, 350);
          } catch (err) {
            status.textContent = 'Ошибка: ' + err.message;

        modalEl = {

            status.textContent = '';

            backdrop.classList.add('is-open');
            setTimeout(function () { textarea.focus(); }, 30);
          }

        return modalEl;

      var rawHtmlModalEl = null;

      function ensureRawHtmlModal() {
        if (rawHtmlModalEl) return rawHtmlModalEl;

        var currentOnApply = null;

        var backdrop = document.createElement('div');
        backdrop.className = 'rfid-modal-backdrop';

        var dialog = document.createElement('div');
        dialog.className = 'rfid-modal is-wide';
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');

        var header = document.createElement('div');
        header.className = 'rfid-modal-header';
        var titleEl = document.createElement('h3');
        titleEl.className = 'rfid-modal-title';
        titleEl.textContent = 'Вставка / редактирование HTML-кода';
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'rfid-modal-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.title = 'Закрыть';
        header.appendChild(titleEl);
        header.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'rfid-modal-body';

        var controlsRow = document.createElement('div');
        controlsRow.className = 'rfid-modal-row';

        var wrapLabel = document.createElement('label');
        wrapLabel.className = 'rfid-modal-check';
        var wrapCb = document.createElement('input');
        wrapCb.type = 'checkbox';
        wrapCb.checked = true;
        wrapLabel.appendChild(wrapCb);
        wrapLabel.appendChild(document.createTextNode('Перенос строк'));

        var hintSpan = document.createElement('span');
        hintSpan.className = 'rfid-modal-hint';
        hintSpan.textContent = 'Tab — отступ (2 пробела), Shift+Tab — убрать отступ, Ctrl+Enter — вставить';

        controlsRow.appendChild(wrapLabel);
        controlsRow.appendChild(hintSpan);

        var codeArea = document.createElement('textarea');
        codeArea.className = 'rfid-modal-textarea is-code';
        codeArea.spellcheck = false;
        codeArea.setAttribute('autocapitalize', 'off');
        codeArea.setAttribute('autocomplete', 'off');
        codeArea.setAttribute('autocorrect', 'off');
        codeArea.placeholder = '<div class="rfid-widget">\n  <!-- HTML, <style> или <script> -->\n</div>';

        wrapCb.addEventListener('change', function () {
          codeArea.classList.toggle('is-nowrap', !wrapCb.checked);
        });

        codeArea.addEventListener('keydown', function (e) {
          if (e.key === 'Tab') {
            e.preventDefault();
            var val = codeArea.value;
            var start = codeArea.selectionStart;
            var end = codeArea.selectionEnd;

            if (start === end && !e.shiftKey) {
              codeArea.value = val.slice(0, start) + '  ' + val.slice(end);
              codeArea.selectionStart = codeArea.selectionEnd = start + 2;
              return;
            }

            var lineStart = val.lastIndexOf('\n', start - 1) + 1;
            var lineEndIdx = val.indexOf('\n', end);
            var lineEnd = lineEndIdx === -1 ? val.length : lineEndIdx;
            if (end > start && end > lineStart && val.charAt(end - 1) === '\n') {
              lineEnd = end - 1;
            }

            var selectedBlock = val.slice(lineStart, lineEnd);
            var lines = selectedBlock.split('\n');
            var firstDelta = 0;
            var totalDelta = 0;

            var updatedLines = lines.map(function (line, idx) {
              if (e.shiftKey) {
                var removed = 0;
                if (line.indexOf('  ') === 0) {
                  removed = 2;
                } else if (line.charAt(0) === '\t' || line.charAt(0) === ' ') {
                  removed = 1;
                }
                if (idx === 0) firstDelta = -removed;
                totalDelta -= removed;
                return line.slice(removed);
              }
              if (idx === 0) firstDelta = 2;
              totalDelta += 2;
              return '  ' + line;
            });

            codeArea.value = val.slice(0, lineStart) + updatedLines.join('\n') + val.slice(lineEnd);
            var nextStart = Math.max(lineStart, start + firstDelta);
            var nextEnd = Math.max(nextStart, end + totalDelta);
            codeArea.selectionStart = nextStart;
            codeArea.selectionEnd = nextEnd;
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            insertBtn.click();
          }
        });

        body.appendChild(controlsRow);
        body.appendChild(codeArea);

        var footer = document.createElement('div');
        footer.className = 'rfid-modal-footer';

        var status = document.createElement('span');
        status.className = 'rfid-modal-status';

        var btnRow = document.createElement('div');
        btnRow.className = 'rfid-modal-row';

        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'rfid-btn-secondary';
        cancelBtn.textContent = 'Отмена';

        var insertBtn = document.createElement('button');
        insertBtn.type = 'button';
        insertBtn.className = 'rfid-btn-primary';
        insertBtn.textContent = 'Вставить в статью';

        btnRow.appendChild(cancelBtn);
        btnRow.appendChild(insertBtn);
        footer.appendChild(status);
        footer.appendChild(btnRow);

        dialog.appendChild(header);
        dialog.appendChild(body);
        dialog.appendChild(footer);
        backdrop.appendChild(dialog);
        document.body.appendChild(backdrop);

        function close() {
          backdrop.classList.remove('is-open');
          currentOnApply = null;
        }

        closeBtn.addEventListener('click', close);
        cancelBtn.addEventListener('click', close);
        backdrop.addEventListener('click', function (e) {
          if (e.target === backdrop) close();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && backdrop.classList.contains('is-open')) {
            close();
          }
        });

        insertBtn.addEventListener('click', function () {
          var raw = codeArea.value;
          if (!String(raw || '').trim()) {
            status.textContent = 'Введите HTML-код';
            codeArea.focus();
            return;
          }
          var cb = currentOnApply;
          close();
          if (typeof cb === 'function') {
            cb(raw);
          }
        });

        rawHtmlModalEl = {
          open: function (opts) {
            var o = opts || {};
            currentOnApply = typeof o.onApply === 'function' ? o.onApply : null;
            codeArea.value = o.initialValue ? String(o.initialValue) : '';
            status.textContent = o.isEditing ? 'Редактирование выбранного HTML-блока' : '';
            codeArea.classList.toggle('is-nowrap', !wrapCb.checked);
            backdrop.classList.add('is-open');
            setTimeout(function () {
              codeArea.focus();
              if (!codeArea.value) {
                codeArea.selectionStart = codeArea.selectionEnd = 0;
              }
            }, 30);
          }
        };
        return rawHtmlModalEl;
      }

      function attachTopImportExport(topBar) {
        if (!topBar || topBar.dataset.rfidIoAttached === '1') return;
        topBar.dataset.rfidIoAttached = '1';

        var group = document.createElement('div');
        group.className = 'rfid-io-group';

        var importBtn = document.createElement('button');
        importBtn.type = 'button';
        importBtn.className = 'rfid-io-btn';
        importBtn.title = 'Импортировать заголовок, описание, дату, категории, теги и текст статьи из .md или .json';
        importBtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="16"/></svg>' +
          '<span>Импорт</span>';
        importBtn.addEventListener('click', function () {
          ensureModal().openImport();
        });

        var exportBtn = document.createElement('button');
        exportBtn.type = 'button';
        exportBtn.className = 'rfid-io-btn';
        exportBtn.title = 'Экспортировать статью со всеми полями (кроме обложки) в .md или .json';
        exportBtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><polyline points="7 11 12 16 17 11"/><line x1="12" y1="4" x2="12" y2="16"/></svg>' +
          '<span>Экспорт</span>';
        exportBtn.addEventListener('click', function () {
          ensureModal().openExport();
        });

        var slugBtn = document.createElement('button');
        slugBtn.type = 'button';
        slugBtn.className = 'rfid-io-btn';
        slugBtn.title = 'Сгенерировать латинский URL-слаг из заголовка статьи';
        slugBtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a3.5 3.5 0 0 0 5 0l4 -4a3.5 3.5 0 0 0 -5 -5l-.5 .5"/><path d="M14 10a3.5 3.5 0 0 0 -5 0l-4 4a3.5 3.5 0 0 0 5 5l.5 -.5"/></svg>' +
          '<span>Slug A-z</span>';
        slugBtn.addEventListener('click', function () {
          fillLatinSlugFromTitle(true);
        });

        var registryBtn = document.createElement('button');
        registryBtn.type = 'button';
        registryBtn.className = 'rfid-io-btn';
        registryBtn.title = 'Открыть таблицу-реестр таксономии и связок (translationKey, категории, теги)';
        registryBtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M9 4v16"/></svg>' +
          '<span>Реестр</span>';
        registryBtn.addEventListener('click', function () {
          ensureRegistryOverlay().open();
        });

        var homeBtn = document.createElement('button');
        homeBtn.type = 'button';
        homeBtn.className = 'rfid-io-btn';
        homeBtn.title = 'Открыть конструктор витрины главной страницы';
        homeBtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>' +
          '<span>Витрина</span>';
        homeBtn.addEventListener('click', function () {
          ensureHomeBuilderOverlay().open();
        });

        group.appendChild(homeBtn);
        group.appendChild(registryBtn);
        group.appendChild(slugBtn);
        group.appendChild(importBtn);
        group.appendChild(exportBtn);

        var lastSub = topBar.querySelector('[class*="ToolbarSubSectionLast"]');
        if (lastSub) {
          lastSub.insertBefore(group, lastSub.firstChild);
        } else {
          topBar.appendChild(group);
        }
      }

      var registryOverlayEl = null;

      function ensureRegistryOverlay() {
        if (registryOverlayEl) return registryOverlayEl;

        var backdrop = document.createElement('div');
        backdrop.className = 'rfid-modal-backdrop';

        var dialog = document.createElement('div');
        dialog.className = 'rfid-modal is-registry';
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');

        var header = document.createElement('div');
        header.className = 'rfid-modal-header';

        var leftHead = document.createElement('div');
        leftHead.style.display = 'flex';
        leftHead.style.alignItems = 'center';
        leftHead.style.gap = '12px';
        var titleEl = document.createElement('h3');
        titleEl.className = 'rfid-modal-title';
        titleEl.textContent = 'Реестр таксономии и связок';
        var extLink = document.createElement('a');
        extLink.href = '/admin/registry.html';
        extLink.target = '_blank';
        extLink.rel = 'noopener noreferrer';
        extLink.className = 'rfid-btn-secondary';
        extLink.style.display = 'inline-flex';
        extLink.style.alignItems = 'center';
        extLink.style.height = '28px';
        extLink.style.fontSize = '12px';
        extLink.style.textDecoration = 'none';
        extLink.textContent = 'Открыть в отдельной вкладке ↗';
        leftHead.appendChild(titleEl);
        leftHead.appendChild(extLink);

        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'rfid-modal-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.title = 'Закрыть реестр';

        header.appendChild(leftHead);
        header.appendChild(closeBtn);

        var iframe = document.createElement('iframe');
        iframe.className = 'rfid-registry-frame';
        iframe.title = 'Реестр таксономии и связок';

        dialog.appendChild(header);
        dialog.appendChild(iframe);
        backdrop.appendChild(dialog);
        document.body.appendChild(backdrop);

        function close() {
          backdrop.classList.remove('is-open');
        }

        closeBtn.addEventListener('click', close);
        backdrop.addEventListener('click', function (e) {
          if (e.target === backdrop) close();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && backdrop.classList.contains('is-open')) {
            close();
          }
        });

        registryOverlayEl = {
          open: function () {
            iframe.src = '/admin/registry.html?t=' + Date.now();
            backdrop.classList.add('is-open');
          }
        };
        return registryOverlayEl;
      }

      var homeBuilderOverlayEl = null;

      function ensureHomeBuilderOverlay() {
        if (homeBuilderOverlayEl) return homeBuilderOverlayEl;

        var backdrop = document.createElement('div');
        backdrop.className = 'rfid-modal-backdrop';

        var dialog = document.createElement('div');
        dialog.className = 'rfid-modal is-registry';
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');

        var header = document.createElement('div');
        header.className = 'rfid-modal-header';

        var leftHead = document.createElement('div');
        leftHead.style.display = 'flex';
        leftHead.style.alignItems = 'center';
        leftHead.style.gap = '12px';
        var titleEl = document.createElement('h3');
        titleEl.className = 'rfid-modal-title';
        titleEl.textContent = 'Конструктор витрины главной';
        var extLink = document.createElement('a');
        extLink.href = '/admin/home-builder.html';
        extLink.target = '_blank';
        extLink.rel = 'noopener noreferrer';
        extLink.className = 'rfid-btn-secondary';
        extLink.style.display = 'inline-flex';
        extLink.style.alignItems = 'center';
        extLink.style.height = '28px';
        extLink.style.fontSize = '12px';
        extLink.style.textDecoration = 'none';
        extLink.textContent = 'Открыть в отдельной вкладке ↗';
        leftHead.appendChild(titleEl);
        leftHead.appendChild(extLink);

        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'rfid-modal-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.title = 'Закрыть конструктор';

        header.appendChild(leftHead);
        header.appendChild(closeBtn);

        var iframe = document.createElement('iframe');
        iframe.className = 'rfid-registry-frame';
        iframe.title = 'Конструктор витрины главной';

        dialog.appendChild(header);
        dialog.appendChild(iframe);
        backdrop.appendChild(dialog);
        document.body.appendChild(backdrop);

        function close() {
          backdrop.classList.remove('is-open');
        }

        closeBtn.addEventListener('click', close);
        backdrop.addEventListener('click', function (e) {
          if (e.target === backdrop) close();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && backdrop.classList.contains('is-open')) {
            close();
          }
        });

        homeBuilderOverlayEl = {
          open: function () {
            iframe.src = '/admin/home-builder.html?t=' + Date.now();
            backdrop.classList.add('is-open');
          }
        };
        return homeBuilderOverlayEl;
      }

      function attachHeaderRegistryButton(headerEl) {
        if (!headerEl || headerEl.dataset.rfidRegistryBtn === '1') return;
        headerEl.dataset.rfidRegistryBtn = '1';

        var wrap = document.createElement('div');
        wrap.style.display = 'inline-flex';
        wrap.style.alignItems = 'center';
        wrap.style.gap = '8px';
        wrap.style.marginLeft = '12px';

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'rfid-io-btn';
        btn.style.height = '32px';
        btn.title = 'Открыть таблицу-реестр таксономии и связок';
        btn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M9 4v16"/></svg>' +
          '<span>Реестр таксономии</span>';
        btn.addEventListener('click', function () {
          ensureRegistryOverlay().open();
        });

        var homeBtn = document.createElement('button');
        homeBtn.type = 'button';
        homeBtn.className = 'rfid-io-btn';
        homeBtn.style.height = '32px';
        homeBtn.title = 'Открыть конструктор витрины главной страницы';
        homeBtn.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>' +
          '<span>Витрина главной</span>';
        homeBtn.addEventListener('click', function () {
          ensureHomeBuilderOverlay().open();
        });

        wrap.appendChild(btn);
        wrap.appendChild(homeBtn);

        var nav = headerEl.querySelector('nav');
        if (nav && nav.parentElement) {
          nav.parentElement.insertBefore(wrap, nav.nextSibling);
        } else {
          headerEl.appendChild(wrap);
        }
      }

      var lastAutoSlugValue = '';

      function fillLatinSlugFromTitle(force) {
        var ctxWrap = findEditorContext();
        if (!ctxWrap || !ctxWrap.props) return false;
        var props = ctxWrap.props;
        var entry = props.entry;
        if (!entry) return false;
        var data = entry.get('data');
        if (!data) return false;

        var title = String(data.get('title') || '').trim();
        var currentSlug = String(data.get('slug') || '').trim();
        if (!title) return false;
        if (!force && currentSlug && currentSlug !== lastAutoSlugValue) return false;

        var nextSlug = toLatinSlug(title);
        if (!nextSlug) return false;

        var fSlug = props.fields && props.fields.find(function (f) { return f.get('name') === 'slug'; });
        if (fSlug && typeof props.onChange === 'function') {
          lastAutoSlugValue = nextSlug;
          props.onChange(fSlug, nextSlug);
          return true;
        }
        return false;
      }

      document.addEventListener('blur', function (e) {
        var target = e.target;
        if (!target || !target.id) return;
        if (target.id.indexOf('title-field-') === 0) {
          var ctxWrap = findEditorContext();
          if (ctxWrap && ctxWrap.props && ctxWrap.props.entry && ctxWrap.props.entry.get('newRecord')) {
            fillLatinSlugFromTitle(false);
          }
        }
      }, true);

      function scanDom() {
        var bars = document.querySelectorAll('[class*="EditorControlBar"]');
        for (var i = 0; i < bars.length; i++) {
          attachToolbar(bars[i]);
        }
        var mainSections = document.querySelectorAll('[class*="ToolbarContainer"] > [class*="ToolbarSectionMain"]');
        for (var j = 0; j < mainSections.length; j++) {
          attachTopImportExport(mainSections[j]);
        }
        var appHeaders = document.querySelectorAll('[class*="AppHeaderContent"]');
        for (var k = 0; k < appHeaders.length; k++) {
          attachHeaderRegistryButton(appHeaders[k]);
        }
      }

      var observer = new MutationObserver(scanDom);
      observer.observe(document.body, { childList: true, subtree: true });
      scanDom();
    })();
  </script>
</body>
</html>
