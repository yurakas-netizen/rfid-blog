  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  <script>
    (function () {
      /* =========================================================
         1. Two-Charts Side-by-Side Component
         ========================================================= */
      if (window.CMS) {
        window.CMS.registerEditorComponent({
          id: 'charts-pair',
          label: 'Два графика / фото в ряд',
          fields: [
            { name: 'img1', label: 'Левый график / фото', widget: 'image' },
            { name: 'alt1', label: 'Подпись слева', widget: 'string', required: false },
            { name: 'img2', label: 'Правый график / фото', widget: 'image' },
            { name: 'alt2', label: 'Подпись справа', widget: 'string', required: false }
          ],
          pattern: /^!\[([^\]]*)\]\(([^\s")]+)\)\s+!\[([^\]]*)\]\(([^\s")]+)\)$/,
          fromBlock: function (match) {
            return {
              alt1: match[1] || '',
              img1: match[2] || '',
              alt2: match[3] || '',
              img2: match[4] || ''
            };
          },
          toBlock: function (data) {
            var a1 = (data.alt1 || '').replace(/[\[\]]/g, '');
            var a2 = (data.alt2 || '').replace(/[\[\]]/g, '');
            return '![' + a1 + '](' + (data.img1 || '') + ') ![' + a2 + '](' + (data.img2 || '') + ')';
          },
          toPreview: function (data) {
            return (
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;">' +
                '<figure style="margin:0;text-align:center;"><img src="' + (data.img1 || '') + '" alt="' + (data.alt1 || '') + '" style="max-width:100%;border-radius:8px;" />' + (data.alt1 ? '<figcaption style="font-size:12px;color:#64748b;margin-top:4px;">' + data.alt1 + '</figcaption>' : '') + '</figure>' +
                '<figure style="margin:0;text-align:center;"><img src="' + (data.img2 || '') + '" alt="' + (data.alt2 || '') + '" style="max-width:100%;border-radius:8px;" />' + (data.alt2 ? '<figcaption style="font-size:12px;color:#64748b;margin-top:4px;">' + data.alt2 + '</figcaption>' : '') + '</figure>' +
              '</div>'
            );
          }
        });

        /* Raw HTML / CSS / JS shortcode block (Hugo {{< rawhtml >}}...{{< /rawhtml >}}) */
        window.CMS.registerEditorComponent({
          id: 'rawhtml',
          label: 'HTML-блок (rawhtml)',
          fields: [
            {
              name: 'html',
              label: 'HTML / CSS / JS код',
              widget: 'text',
              required: false
            }
          ],
          pattern: /^\{\{<\s*rawhtml\s*>\}\}([\s\S]*?)\{\{<\s*\/rawhtml\s*>\}\}[ \t]*(?=\r?\n|$)/,
          fromBlock: function (match) {
            var raw = match && match[1] ? String(match[1]) : '';
            return {
              html: raw.replace(/^\r?\n|\r?\n$/g, '')
            };
          },
          toBlock: function (data) {
            var code = String((data && data.html) || '').replace(/^\r?\n|\r?\n$/g, '');
            return '{{< rawhtml >}}\n' + code + '\n{{< /rawhtml >}}';
          },
          toPreview: function (data) {
            var code = String((data && data.html) || '').trim();
            if (!code) {
              return '<div style="padding:10px 14px;border:1px dashed #94a3b8;border-radius:8px;background:#f8fafc;color:#475569;font-size:12.5px;">&lt;/&gt; Пустой HTML-блок (rawhtml)</div>';
            }
            var scriptRe = new RegExp('<script\\b[^>]*>[\\s\\S]*?<\\/' + 'script>', 'gi');
            var styleRe = new RegExp('<style\\b[^>]*>[\\s\\S]*?<\\/' + 'style>', 'gi');
            var scriptCount = 0;
            var safePreview = code.replace(scriptRe, function () {
              scriptCount++;
              return '';
            }).trim();
            var scriptBadge = scriptCount > 0
              ? '<div style="margin-top:8px;padding:6px 10px;border-radius:6px;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;font-size:12px;">&lt;script&gt; (' + scriptCount + '): выполнится на опубликованной странице Hugo</div>'
              : '';
            var onlyStylesOrHidden = !safePreview.replace(styleRe, '').trim();
            var fallbackNotice = onlyStylesOrHidden && scriptCount === 0
              ? '<div style="padding:8px 12px;border-radius:6px;background:#f1f5f9;border:1px dashed #94a3b8;color:#475569;font-size:12px;">&lt;/&gt; Скрытый HTML/CSS-блок (rawhtml)</div>'
              : '';
            return (
              '<div class="rfid-rawhtml-preview" style="margin:10px 0;">' +
                safePreview +
                fallbackNotice +
                scriptBadge +
              '</div>'
            );
          }
        });

        /* Preserve $...$ and $$...$$ LaTeX math verbatim across Rich Text <-> Markdown */
        if (typeof window.CMS.registerRemarkPlugin === 'function') {
          window.CMS.registerRemarkPlugin(function rfidMathRemarkPlugin() {
            var Parser = this.Parser;
            if (!Parser || !Parser.prototype || !Parser.prototype.inlineTokenizers) return;
            var inlineTokenizers = Parser.prototype.inlineTokenizers;
            var inlineMethods = Parser.prototype.inlineMethods;

            function mathInlineTokenizer(eat, value, silent) {
              if (!value || value.charAt(0) !== '$') return;
              var isDouble = value.charAt(1) === '$';
              var delim = isDouble ? '$$' : '$';
              var start = delim.length;
              if (!isDouble) {
                if (value.length <= 1 || /\s/.test(value.charAt(1))) return;
              }
              var end = -1;
              for (var i = start; i < value.length; i++) {
                if (value.charAt(i) === '\\') {
                  i++;
                  continue;
                }
                if (isDouble) {
                  if (value.charAt(i) === '$' && value.charAt(i + 1) === '$') {
                    end = i;
                    break;
                  }
                } else {
                  if (value.charAt(i) === '\n') return;
                  if (value.charAt(i) === '$' && !/\s/.test(value.charAt(i - 1))) {
                    end = i;
                    break;
                  }
                }
              }
              if (end === -1 || end === start) return;
              var fullMatch = value.slice(0, end + delim.length);
              var inner = value.slice(start, end);
              if (!isDouble && /^\d[\d.,\s]*$/.test(inner.trim())) return;
              if (silent) return true;
              return eat(fullMatch)({
                type: 'text',
                value: fullMatch
              });
            }

            mathInlineTokenizer.locator = function (value, fromIndex) {
              return value.indexOf('$', fromIndex);
            };

            inlineTokenizers.rfidMath = mathInlineTokenizer;
            if (Array.isArray(inlineMethods) && inlineMethods.indexOf('rfidMath') === -1) {
              var escapeIdx = inlineMethods.indexOf('escape');
              if (escapeIdx !== -1) {
                inlineMethods.splice(escapeIdx, 0, 'rfidMath');
              } else {
                inlineMethods.unshift('rfidMath');
              }
            }
          });
        }
      }

      /* =========================================================
         2. React Fiber Helpers
         ========================================================= */
      function getFiber(el) {
        if (!el) return null;
        var keys = Object.keys(el);
        for (var i = 0; i < keys.length; i++) {
          if (keys[i].indexOf('__reactFiber$') === 0 || keys[i].indexOf('__reactInternalInstance$') === 0) {
            return el[keys[i]];
          }
        }
        return null;
      }

      function findSlateEditor(slateEl) {
        var fiber = getFiber(slateEl);
        var steps = 0;
        while (fiber && steps < 60) {
          var p = fiber.memoizedProps || fiber.pendingProps;
          if (p) {
            if (p.editor && typeof p.editor.undo === 'function') return p.editor;
            if (p.value && typeof p.value.undo === 'function') return p.value;
          }
          fiber = fiber.return;
          steps++;
        }
        return null;
      }

      function findToolbarProps(controlBar) {
        if (!controlBar) return null;
        var decapChild = controlBar.firstElementChild;
        if (decapChild && (decapChild.classList.contains('rfid-cms-toolbar') || decapChild.classList.contains('rfid-cms-findbar'))) {
          decapChild = null;
        }
        var candidate = (decapChild && (decapChild.querySelector('button') || decapChild)) || controlBar.querySelector('button') || controlBar;
        var fiber = getFiber(candidate);

        function makeRawHtmlNode(htmlCode) {

        function setSlateSelection(editor, range) {

          }

        function findLastLeafPoint(editor) {
          var children = editor && Array.isArray(editor.children) ? editor.children : [];
          if (!children.length) return { path: [0, 0], offset: 0 };
          var idx = children.length - 1;
          var path = [idx];
          var cur = children[idx];
          while (cur && Array.isArray(cur.children) && cur.children.length > 0) {
            var lastChildIdx = cur.children.length - 1;
            path.push(lastChildIdx);
            cur = cur.children[lastChildIdx];

        function findFirstLeafPointInNode(node, topIdx) {

            cur = cur.children[0];

            }
            cur = cur.children[seg];

          return !!(
            cur &&
            typeof cur.text === 'string' &&
            typeof point.offset === 'number' &&
            point.offset >= 0 &&
            point.offset <= cur.text.length

        function isEmptyTopParagraph(node) {

            node &&
            node.type === 'paragraph' &&

        function findRawModeShortcodeRange(children, lineIdx) {

        var htmlBtn = makeBtn({
          title: 'Вставить или редактировать сырой HTML / CSS / JS блок ({{< rawhtml >}})',

          onClick: function () {

            var isRaw = !!(ctx.tb && ctx.tb.rawMode);
            var savedSel = null;
            if (ctx.editor && ctx.editor.selection) {
              try {
                savedSel = JSON.parse(JSON.stringify(ctx.editor.selection));
              } catch (_) {}
            }

            var initialHtml = '';
            var editingSlateNode = null;
            var editingRawRange = null;

            if (!isRaw && ctx.editor) {
              if (savedSel && savedSel.anchor && Array.isArray(savedSel.anchor.path)) {
                var topIdx = savedSel.anchor.path[0];

                initialHtml = rawMatch ? rawMatch[1].replace(/^\r?\n|\r?\n$/g, '') : selectedText;
              }
              if (!initialHtml && ctx.editor && savedSel && savedSel.anchor && Array.isArray(savedSel.anchor.path)) {
                var rawRange = findRawModeShortcodeRange(ctx.editor.children, savedSel.anchor.path[0]);

                  editingRawRange = rawRange;

                }

            }

            ensureRawHtmlModal().open({
              initialValue: initialHtml,
              isEditing: !!(editingSlateNode || editingRawRange),
              onApply: function (rawCode) {
                var cleanCode = String(rawCode || '').replace(/^\r?\n|\r?\n$/g, '');
                var liveCtx = getCtx();
                if (!liveCtx.editor) return;
                var ed = liveCtx.editor;

                liveCtx.slateEl.focus({ preventScroll: true });

                var currentlyRaw = !!(liveCtx.tb && liveCtx.tb.rawMode);

                if (currentlyRaw) {
                  var codeLines = cleanCode ? cleanCode.split(/\r?\n/) : [''];
                  var blockLines = ['{{< rawhtml >}}'].concat(codeLines, ['{{< /rawhtml >}}']);
                  var children = Array.isArray(ed.children) ? ed.children : [];

                  if (editingRawRange && editingRawRange.start >= 0 && editingRawRange.end < children.length) {
                    var startLine = editingRawRange.start;
                    var count = editingRawRange.end - editingRawRange.start + 1;
                    for (var bi = 0; bi < blockLines.length; bi++) {
                      ed.apply({
                        type: 'insert_node',
                        path: [startLine + count + bi],
                        node: { type: 'paragraph', children: [{ text: blockLines[bi] }] }
                      });
                    }
                    for (var ri = 0; ri < count; ri++) {
                      ed.apply({
                        type: 'remove_node',
                        path: [startLine],
                        node: ed.children[startLine]
                      });
                    }
                    var endLineIdx = startLine + blockLines.length - 1;
                    var endText = ed.children[endLineIdx] && ed.children[endLineIdx].children[0]
                      ? ed.children[endLineIdx].children[0].text.length
                      : 0;
                    setSlateSelection(ed, {
                      anchor: { path: [endLineIdx, 0], offset: endText },
                      focus: { path: [endLineIdx, 0], offset: endText }

                    var targetIdx = hasChildren
                      ? ((savedSel && savedSel.anchor && Array.isArray(savedSel.anchor.path))
                          ? Math.min(savedSel.anchor.path[0], children.length - 1)
                          : children.length - 1)
                      : 0;
                    var targetNode = hasChildren ? children[targetIdx] : null;
                    var replaceEmpty = isEmptyTopParagraph(targetNode);
                    var insertAt = hasChildren ? targetIdx + 1 : 0;

                    if (hasChildren && !replaceEmpty && targetNode && targetNode.children && targetNode.children[0] && targetNode.children[0].text !== '') {
                      blockLines.unshift('');
                    }
                    var nextRawNode = hasChildren ? children[targetIdx + 1] : null;
                    if (!hasChildren || targetIdx >= children.length - 1 || !isEmptyTopParagraph(nextRawNode)) {
                      blockLines.push('');

                    for (var k = 0; k < blockLines.length; k++) {
                      ed.apply({
                        type: 'insert_node',
                        path: [insertAt + k],
                        node: { type: 'paragraph', children: [{ text: blockLines[k] }] }

                    }
                    if (replaceEmpty) {
                      ed.apply({
                        type: 'remove_node',
                        path: [targetIdx],
                        node: targetNode
                      });
                      insertAt = targetIdx;
                    }
                    var cursorLine = insertAt + blockLines.length - 1;
                    var cursorText = ed.children[cursorLine] && ed.children[cursorLine].children[0]
                      ? ed.children[cursorLine].children[0].text.length
                      : 0;
                    setSlateSelection(ed, {
                      anchor: { path: [cursorLine, 0], offset: cursorText },
                      focus: { path: [cursorLine, 0], offset: cursorText }
                    });
                  }
                  requestAnimationFrame(refreshState);
                  return;
                }

                // Rich-text mode
                var updatedNode = makeRawHtmlNode(cleanCode);
                if (editingSlateNode) {
                  var editIdx = (ed.children && ed.children[editingSlateNode.index] === editingSlateNode.node)
                    ? editingSlateNode.index
                    : (ed.children ? ed.children.indexOf(editingSlateNode.node) : -1);

                  if (editIdx !== -1 && typeof ed.apply === 'function') {
                    // Insert first then remove so children never temporarily hits length 0 (which triggers Decap's empty-paragraph normalizer)
                    ed.apply({
                      type: 'insert_node',
                      path: [editIdx + 1],
                      node: updatedNode
                    });
                    ed.apply({
                      type: 'remove_node',
                      path: [editIdx],
                      node: editingSlateNode.node
                    });
                    ensureEditableParagraphAfter(ed, editIdx);
                    requestAnimationFrame(refreshState);
                    return;
                  }
                }

                // Inserting a new rawhtml block in rich-text mode
                var restored = savedSel && isValidSlatePoint(ed, savedSel.anchor) && isValidSlatePoint(ed, savedSel.focus)
                  ? setSlateSelection(ed, savedSel)
                  : false;

                var richChildren = Array.isArray(ed.children) ? ed.children : [];
                if (!restored) {
                  var lastIdx = Math.max(0, richChildren.length - 1);
                  var lastNode = richChildren[lastIdx];
                  if (richChildren.length > 0 && isEmptyTopParagraph(lastNode) && typeof ed.apply === 'function') {
                    ed.apply({ type: 'insert_node', path: [lastIdx + 1], node: updatedNode });
                    ed.apply({ type: 'remove_node', path: [lastIdx], node: lastNode });
                    ensureEditableParagraphAfter(ed, lastIdx);
                  } else if (typeof ed.apply === 'function') {
                    var appendIdx = richChildren.length;
                    ed.apply({ type: 'insert_node', path: [appendIdx], node: updatedNode });
                    ensureEditableParagraphAfter(ed, appendIdx);
                  }
                  requestAnimationFrame(refreshState);
                  return;
                }

                var selTopIdx = (ed.selection && ed.selection.anchor && Array.isArray(ed.selection.anchor.path))
                  ? ed.selection.anchor.path[0]
                  : Math.max(0, richChildren.length - 1);
                var currentTopNode = richChildren[selTopIdx];

                if (isEmptyTopParagraph(currentTopNode) && typeof ed.apply === 'function') {
                  // Replace the empty paragraph (common on /new) without leaving a phantom blank line before the HTML block
                  ed.apply({
                    type: 'insert_node',
                    path: [selTopIdx + 1],
                    node: updatedNode
                  });
                  ed.apply({
                    type: 'remove_node',
                    path: [selTopIdx],
                    node: currentTopNode
                  });
                  ensureEditableParagraphAfter(ed, selTopIdx);
                } else if (isVoidTopNode(ed, currentTopNode) && typeof ed.apply === 'function') {
                  var afterVoidIdx = selTopIdx + 1;
                  ed.apply({
                    type: 'insert_node',
                    path: [afterVoidIdx],
                    node: updatedNode
                  });
                  ensureEditableParagraphAfter(ed, afterVoidIdx);
                } else {
                  try {
                    ed.insertNode(updatedNode);
                    var insertedIdx = ed.children ? ed.children.indexOf(updatedNode) : -1;
                    if (insertedIdx !== -1) {
                      ensureEditableParagraphAfter(ed, insertedIdx);
                    }
                  } catch (_) {
                    var fallbackPt = findLastLeafPoint(ed);
                    setSlateSelection(ed, { anchor: fallbackPt, focus: fallbackPt });
                    ed.insertText('\n{{< rawhtml >}}\n' + cleanCode + '\n{{< /rawhtml >}}\n');
                  }
                }
                requestAnimationFrame(refreshState);
              }
            });
          }
        });

        var findToggleBtn = makeBtn({
          title: 'Найти и заменить в тексте',
          label: 'Поиск',
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6 -6"/></svg>',
          onClick: function () {
            var open = findBar.classList.toggle('is-open');
            findToggleBtn.classList.toggle('is-active', open);
            if (open) {
              findInput.focus();
              findInput.select();
            }
          }
        });

        function selectMatch(fromStart) {
          var q = findInput.value;
          if (!q) {
            findStatus.textContent = '';
            return false;
          }
          var ctx = getCtx();
          var walker = document.createTreeWalker(ctx.slateEl, NodeFilter.SHOW_TEXT);
          var qLower = q.toLowerCase();
          var nodes = [];
          var n;
          while ((n = walker.nextNode())) {
            if (n.nodeValue && n.nodeValue.length > 0) nodes.push(n);
          }

          var sel = window.getSelection();
          var startIdx = 0;
          var startOffset = 0;
          if (!fromStart && sel && sel.rangeCount > 0) {
            var cur = sel.getRangeAt(0);
            for (var i = 0; i < nodes.length; i++) {
              if (nodes[i] === cur.endContainer) {
                startIdx = i;
                startOffset = cur.endOffset;
                break;
              }
            }
          }

          for (var pass = 0; pass < 2; pass++) {
            var iBegin = pass === 0 ? startIdx : 0;
            var iEnd = pass === 0 ? nodes.length : startIdx + 1;
            for (var j = iBegin; j < iEnd; j++) {
              var text = nodes[j].nodeValue;
              var offset = pass === 0 && j === startIdx ? startOffset : 0;
              var hit = text.toLowerCase().indexOf(qLower, offset);
              if (hit !== -1) {
                ctx.slateEl.focus({ preventScroll: true });
                var range = document.createRange();
                range.setStart(nodes[j], hit);
                range.setEnd(nodes[j], hit + q.length);
                sel.removeAllRanges();
                sel.addRange(range);
                if (nodes[j].parentElement) {
                  nodes[j].parentElement.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }
                findStatus.textContent = 'Найдено';
                return true;
              }
            }
          }
          findStatus.textContent = 'Не найдено';
          return false;
        }

        var findNextBtn = document.createElement('button');
        findNextBtn.type = 'button';
        findNextBtn.className = 'rfid-cms-btn';
        findNextBtn.textContent = 'Найти далее';
        findNextBtn.addEventListener('click', function () {
          selectMatch(false);
        });

        var replaceOneBtn = document.createElement('button');
        replaceOneBtn.type = 'button';
        replaceOneBtn.className = 'rfid-cms-btn';
        replaceOneBtn.textContent = 'Заменить';
        replaceOneBtn.addEventListener('click', function () {
          var q = findInput.value;
          if (!q) return;
          var sel = window.getSelection();
          var current = sel ? sel.toString() : '';
          if (current.toLowerCase() !== q.toLowerCase()) {
            if (!selectMatch(false)) return;
          } else {
            focusSlate();
          }
          document.execCommand('insertText', false, replaceInput.value);
          requestAnimationFrame(function () {
            refreshState();
            selectMatch(false);
          });
        });

        var replaceAllBtn = document.createElement('button');
        replaceAllBtn.type = 'button';
        replaceAllBtn.className = 'rfid-cms-btn';
        replaceAllBtn.textContent = 'Заменить всё';
        replaceAllBtn.addEventListener('click', function () {
          var q = findInput.value;
          if (!q) return;
          var rep = replaceInput.value;
          if (q.toLowerCase() === rep.toLowerCase() && q === rep) return;
          var count = 0;
          var guard = 0;
          while (guard < 200 && selectMatch(true)) {
            document.execCommand('insertText', false, rep);
            count++;
            guard++;
            if (rep.toLowerCase().indexOf(q.toLowerCase()) !== -1) break;
          }
          findStatus.textContent = count > 0 ? 'Заменено: ' + count : 'Не найдено';
          requestAnimationFrame(refreshState);
        });

        var closeFindBtn = document.createElement('button');
        closeFindBtn.type = 'button';
        closeFindBtn.className = 'rfid-cms-btn';
        closeFindBtn.textContent = '×';
        closeFindBtn.title = 'Закрыть поиск';
        closeFindBtn.addEventListener('click', function () {
          findBar.classList.remove('is-open');
          findToggleBtn.classList.remove('is-active');
        });

        findInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            selectMatch(false);
          }
        });

        findBar.appendChild(findInput);
        findBar.appendChild(replaceInput);
        findBar.appendChild(findNextBtn);
        findBar.appendChild(replaceOneBtn);
        findBar.appendChild(replaceAllBtn);
        findBar.appendChild(findStatus);
        findBar.appendChild(closeFindBtn);

        bar.appendChild(undoBtn);
        bar.appendChild(redoBtn);
        bar.appendChild(makeSep());
        bar.appendChild(strikeBtn);
        bar.appendChild(clearBtn);
        bar.appendChild(makeSep());
        bar.appendChild(imgBtn);
        bar.appendChild(pairBtn);
        bar.appendChild(tableBtn);
        bar.appendChild(htmlBtn);
        bar.appendChild(hrBtn);
        bar.appendChild(makeSep());
        bar.appendChild(findToggleBtn);

        controlBar.appendChild(bar);
        controlBar.appendChild(findBar);

        wrapper.addEventListener('keyup', refreshState);
        wrapper.addEventListener('mouseup', refreshState);
        wrapper.addEventListener('input', refreshState);
        controlBar.addEventListener('click', function () {
          setTimeout(refreshState, 30);
        });
        setTimeout(refreshState, 100);
      }

      /* =========================================================
         4. Article Import / Export (All Fields Except Images)
         ========================================================= */
      function stripBodyImages(md) {
        return String(md || '')
          .replace(/!\[[^\]]*\]\([^)]*\)\s*/g, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      function stripQuotes(s) {
        var str = String(s || '').trim();
        if (str.length >= 2 && str[0] === '"' && str[str.length - 1] === '"') {
          try {
            return JSON.parse(str);
          } catch (_) {
            return str.slice(1, -1).replace(/\\"/g, '"').replace(/\\n/g, '\n');
          }
        }
        if (str.length >= 2 && str[0] === "'" && str[str.length - 1] === "'") {
          return str.slice(1, -1).replace(/''/g, "'");
        }
        return str;
      }

      function normalizeIsoDate(val) {
        if (!val) return '';
        if (val instanceof Date) {
          return isNaN(val.getTime()) ? '' : val.toISOString();
        }
        if (typeof val === 'object') {
          if (typeof val.toDate === 'function') {
            var dObj = val.toDate();
            return dObj && !isNaN(dObj.getTime()) ? dObj.toISOString() : '';
          }
          if (typeof val.toISOString === 'function') {
            try { return val.toISOString(); } catch (_) {}
          }
        }
        var str = String(val).trim();
        if (!str) return '';
        var parsed = new Date(str);
        if (!isNaN(parsed.getTime())) {
          return parsed.toISOString();
        }
        return str;
      }

      function formatYamlListItem(val) {
        var str = String(val);
        return /[:#\[\]{}&*!|>'"%@`,?]|^-|^\s|\s$/.test(str) ? JSON.stringify(str) : str;
      }

      function serializeMarkdownArticle(data, stripInlineImages) {
        var lines = ['---'];
        lines.push('title: ' + JSON.stringify(String(data.title || '')));
        if (data.slug) {
          lines.push('slug: ' + JSON.stringify(String(data.slug).trim()));
        }
        if (data.description) {
          lines.push('description: ' + JSON.stringify(String(data.description)));
        }
        var isoDate = normalizeIsoDate(data.date);
        if (isoDate) {
          lines.push('date: ' + isoDate);
        }
        if (data.translationKey) {
          lines.push('translationKey: ' + JSON.stringify(String(data.translationKey).trim()));
        }
        if (Array.isArray(data.categories) && data.categories.length > 0) {
          lines.push('categories:');
          data.categories.forEach(function (c) {
            lines.push('  - ' + formatYamlListItem(c));
          });
        }
        if (Array.isArray(data.tags) && data.tags.length > 0) {
          lines.push('tags:');
          data.tags.forEach(function (t) {
            lines.push('  - ' + formatYamlListItem(t));
          });
        }
        lines.push('---');
        var body = stripInlineImages ? stripBodyImages(data.body) : String(data.body || '');
        if (body) lines.push(body);
        return lines.join('\n') + '\n';
      }

      function serializeJsonArticle(data, stripInlineImages) {
        var payload = {
          title: String(data.title || ''),
          slug: String(data.slug || '').trim(),
          description: String(data.description || ''),
          date: normalizeIsoDate(data.date),
          translationKey: String(data.translationKey || '').trim(),
          categories: Array.isArray(data.categories) ? data.categories : [],
          tags: Array.isArray(data.tags) ? data.tags : [],
          body: stripInlineImages ? stripBodyImages(data.body) : String(data.body || '')
        };
        return JSON.stringify(payload, null, 2) + '\n';
      }

      function parseYamlFrontmatter(yamlText) {
        var lines = yamlText.replace(/\r\n/g, '\n').split('\n');
        var out = {};
        var i = 0;

        while (i < lines.length) {
          var line = lines[i];
          if (!line.trim() || line.trim()[0] === '#') {
            i++;
            continue;
          }
          var m = line.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
          if (!m) {
            i++;
            continue;
          }
          var key = m[1];
          var rest = m[2];

          if (rest === '|' || rest === '|-' || rest === '>' || rest === '>-') {
            var block = [];
            i++;
            while (i < lines.length && (/^\s+/.test(lines[i]) || lines[i] === '')) {
              block.push(lines[i].replace(/^\s{2}/, ''));
              i++;
            }
            out[key] = block.join(rest[0] === '>' ? ' ' : '\n').trim();
            continue;
          }

          if (rest.trim() === '') {
            var arr = [];
            var j = i + 1;
            while (j < lines.length && /^\s*-\s+/.test(lines[j])) {
              arr.push(stripQuotes(lines[j].replace(/^\s*-\s+/, '')));
              j++;
            }
            if (arr.length > 0) {
              out[key] = arr;
              i = j;
              continue;
            }
            out[key] = '';
            i++;
            continue;
          }

          var trimmed = rest.trim();
          if (trimmed[0] === '[' && trimmed[trimmed.length - 1] === ']') {
            var inner = trimmed.slice(1, -1).trim();
            out[key] = inner
              ? inner.split(',').map(function (x) { return stripQuotes(x); }).filter(Boolean)
              : [];
            i++;
            continue;
          }

          // Handle multi-line quoted or folded scalar continuation
          var valParts = [rest];
          var k = i + 1;
          var startsQuote = trimmed[0] === '"' && !(trimmed.length > 1 && trimmed[trimmed.length - 1] === '"' && trimmed[trimmed.length - 2] !== '\\');
          while (k < lines.length && /^\s+/.test(lines[k]) && !/^\s*-\s+/.test(lines[k])) {
            valParts.push(lines[k].trim());
            var joined = valParts.join(' ');
            k++;
            if (startsQuote && /[^\\]"$/.test(joined.trim())) break;
          }
          out[key] = stripQuotes(valParts.join(' '));
          i = k;
        }
        return out;
      }

      function parseImportedArticle(rawText) {
        var text = String(rawText || '').replace(/^\uFEFF/, '');
        var trimmed = text.trim();
        if (!trimmed) {
          throw new Error('Пустой файл или текст');
        }

        if (trimmed[0] === '{') {
          var obj = JSON.parse(trimmed);
          return {
            hasTitle: typeof obj.title === 'string',
            title: typeof obj.title === 'string' ? obj.title : '',
            hasSlug: typeof obj.slug === 'string' && obj.slug.trim().length > 0,
            slug: typeof obj.slug === 'string' ? obj.slug.trim() : '',
            hasDescription: typeof obj.description === 'string',
            description: typeof obj.description === 'string' ? obj.description : '',
            hasDate: Boolean(obj.date),
            date: obj.date ? String(obj.date) : '',
            hasTranslationKey: typeof obj.translationKey === 'string',
            translationKey: typeof obj.translationKey === 'string' ? obj.translationKey : '',
            hasCategories: Array.isArray(obj.categories),
            categories: Array.isArray(obj.categories) ? obj.categories.map(String).filter(Boolean) : [],
            hasTags: Array.isArray(obj.tags),
            tags: Array.isArray(obj.tags) ? obj.tags.map(String).filter(Boolean) : [],
            hasBody: typeof obj.body === 'string',
            body: typeof obj.body === 'string' ? obj.body : ''
          };
        }

        var fmMatch = text.match(/^\s*---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
        if (fmMatch) {
          var meta = parseYamlFrontmatter(fmMatch[1]);
          var body = (fmMatch[2] || '').replace(/^\r?\n/, '');
          var cats = Array.isArray(meta.categories)
            ? meta.categories
            : (typeof meta.categories === 'string' && meta.categories ? meta.categories.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : []);
          var tags = Array.isArray(meta.tags)
            ? meta.tags
            : (typeof meta.tags === 'string' && meta.tags ? meta.tags.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : []);
          return {
            hasTitle: typeof meta.title === 'string' && meta.title.length > 0,
            title: typeof meta.title === 'string' ? meta.title : '',
            hasSlug: typeof meta.slug === 'string' && meta.slug.trim().length > 0,
            slug: typeof meta.slug === 'string' ? meta.slug.trim() : '',
            hasDescription: typeof meta.description === 'string',
            description: typeof meta.description === 'string' ? meta.description : '',
            hasDate: Boolean(meta.date),
            date: meta.date ? String(meta.date) : '',
            hasTranslationKey: typeof meta.translationKey === 'string' && meta.translationKey.length > 0,
            translationKey: typeof meta.translationKey === 'string' ? meta.translationKey : '',
            hasCategories: 'categories' in meta,
            categories: cats,
            hasTags: 'tags' in meta,
            tags: tags,
            hasBody: true,
            body: body
          };
        }

        // Plain markdown fallback (extract optional # H1 if first line)
        return {
          hasTitle: false,
          title: '',
          hasSlug: false,
          slug: '',
          hasDescription: false,
          description: '',
          hasDate: false,
          date: '',
          hasTranslationKey: false,
          translationKey: '',
          hasCategories: false,
          categories: [],
          hasTags: false,
          tags: [],
          hasBody: true,
          body: text
        };
      }

      function toLatinSlug(text) {
        var map = {
          'а':'a','б':'b','в':'v','г':'g','ґ':'g','д':'d','е':'e','ё':'yo','є':'ye',
          'ж':'zh','з':'z','и':'i','і':'i','ї':'yi','й':'y','к':'k','л':'l','м':'m',
          'н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh',
          'ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',
          'æ':'ae','ø':'o','å':'a','ß':'ss','ł':'l','đ':'d','ð':'d','þ':'th'
        };
        var lower = String(text || '').toLowerCase();
        var out = '';
        for (var i = 0; i < lower.length; i++) {
          var ch = lower[i];
          if (Object.prototype.hasOwnProperty.call(map, ch)) {
            out += map[ch];
          } else {
            out += ch;
          }
        }
        out = out.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        out = out
          .replace(/['’ʼ`]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .replace(/-{2,}/g, '-');
        if (out.length > 80) {
          var cut = out.slice(0, 80);
          var lastDash = cut.lastIndexOf('-');
          out = (lastDash > 40 ? cut.slice(0, lastDash) : cut).replace(/-+$/g, '');
        }
        return out;
      }

      function slugFileName(title, ext) {
        var base = toLatinSlug(title) || 'article';
        return base + '.' + ext;
      }

      function readCurrentEntryData() {
        var ctx = findEditorContext();
        if (!ctx || !ctx.props || !ctx.props.entry) return null;
        var raw = ctx.props.entry.get('data');
        var js = raw && typeof raw.toJS === 'function' ? raw.toJS() : {};
        return {
          ctx: ctx.props,
          data: {
            title: js.title || '',
            slug: js.slug || '',
            description: js.description || '',
            date: normalizeIsoDate(js.date) || new Date().toISOString(),
            translationKey: js.translationKey || '',
            categories: Array.isArray(js.categories) ? js.categories : [],
            tags: Array.isArray(js.tags) ? js.tags : [],
            body: js.body || ''
          }
        };
      }

      function applyImportedData(parsed, opts) {
        var ctxWrap = findEditorContext();
        if (!ctxWrap) {
          throw new Error('Редактор статьи не найден');
        }
        var props = ctxWrap.props;
        var fields = props.fields;
        var onChange = props.onChange;

        function getField(name) {
          return fields.find(function (f) { return f.get('name') === name; });
        }

        if (opts.title && parsed.hasTitle) {
          var fTitle = getField('title');
          if (fTitle) onChange(fTitle, parsed.title);
        }

        if (opts.slug) {
          var fSlug = getField('slug');
          if (fSlug) {
            if (parsed.hasSlug) {
              onChange(fSlug, parsed.slug);
            } else if (parsed.hasTitle) {
              var currentData = props.entry && props.entry.get('data');
              var existingSlug = currentData ? String(currentData.get('slug') || '').trim() : '';
              if (!existingSlug) {
                var autoSlug = toLatinSlug(parsed.title);
                if (autoSlug) onChange(fSlug, autoSlug);
              }
            }
          }
        }

        if (opts.description && parsed.hasDescription) {
          var fDesc = getField('description');
          if (fDesc) onChange(fDesc, parsed.description);
        }

        if (opts.date && parsed.hasDate) {
          var fDate = getField('date');
          if (fDate) {
            onChange(fDate, normalizeIsoDate(parsed.date) || parsed.date);
          }
        }

        if (opts.translationKey && parsed.hasTranslationKey) {
          var fTk = getField('translationKey');
          if (fTk) onChange(fTk, parsed.translationKey);
        }

        if (opts.categories && parsed.hasCategories) {
          var fCat = getField('categories');
          var catList = fields.clear().push.apply(fields.clear(), parsed.categories);
          var catCtrl = findListControlInstance('categories');
          if (catCtrl && catCtrl.inst) {
            catCtrl.inst.handleChange({ target: { value: parsed.categories.join(', ') } });
          } else if (fCat) {
            onChange(fCat, catList);
          }
        }

        if (opts.tags && parsed.hasTags) {
          var fTag = getField('tags');
          var tagList = fields.clear().push.apply(fields.clear(), parsed.tags);
          var tagCtrl = findListControlInstance('tags');
          if (tagCtrl && tagCtrl.inst) {
            tagCtrl.inst.handleChange({ target: { value: parsed.tags.join(', ') } });
          } else if (fTag) {
            onChange(fTag, tagList);
          }
        }

        if (opts.body && parsed.hasBody) {
          var fBody = getField('body');
          var bodyText = opts.stripImages ? stripBodyImages(parsed.body) : parsed.body;
          if (fBody) onChange(fBody, bodyText);
          var mdInsts = findMarkdownControlInstances();
          mdInsts.forEach(function (inst) {
            var origMode = inst.state.mode || 'rich_text';
            var tempMode = origMode === 'rich_text' ? 'raw' : 'rich_text';
            try {
              inst.handleMode(tempMode);
              setTimeout(function () {
                try { inst.handleMode(origMode); } catch (_) {}
              }, 35);
            } catch (_) {}
          });
        }

        if (typeof schedulePromptSync === 'function') {
          setTimeout(schedulePromptSync, 60);
        }
      }

      /* =========================================================
         5. Import / Export Modal UI
         ========================================================= */
      var modalEl = null;

      function ensureModal() {
        if (modalEl) return modalEl;

        var backdrop = document.createElement('div');
        backdrop.className = 'rfid-modal-backdrop';
        backdrop.innerHTML =

        function refreshImportSummary() {

            return;
          }
          try {
            var parsed = parseImportedArticle(textarea.value);
            var parts = [];
            if (parsed.hasTitle) parts.push('Заголовок');
            if (parsed.hasSlug) parts.push('URL-слаг');
            if (parsed.hasDescription) parts.push('Описание');
            if (parsed.hasDate) parts.push('Дата');
            if (parsed.hasTranslationKey) parts.push('Ключ перевода');
            if (parsed.hasCategories) parts.push('Категории (' + parsed.categories.length + ')');
            if (parsed.hasTags) parts.push('Теги (' + parsed.tags.length + ')');
            if (parsed.hasBody) parts.push('Текст (' + parsed.body.length + ' симв.)');
            summary.textContent = 'Распознано: ' + (parts.length ? parts.join(' · ') : 'только текст');

      function ensureRawHtmlModal() {
        if (rawHtmlModalEl) return rawHtmlModalEl;

        var currentOnApply = null;

        var backdrop = document.createElement('div');
        backdrop.className = 'rfid-modal-backdrop';

        var dialog = document.createElement('div');
        dialog.className = 'rfid-modal is-wide';
        dialog.setAttribute('role', 'dialog');

        closeBtn.type = 'button';
        closeBtn.className = 'rfid-modal-close';

        closeBtn.title = 'Закрыть';
        header.appendChild(titleEl);
        header.appendChild(closeBtn);

        var body = document.createElement('div');
        body.className = 'rfid-modal-body';

        var controlsRow = document.createElement('div');
        controlsRow.className = 'rfid-modal-row';

        var wrapLabel = document.createElement('label');
        wrapLabel.className = 'rfid-modal-check';
        var wrapCb = document.createElement('input');
        wrapCb.type = 'checkbox';
        wrapCb.checked = true;
        wrapLabel.appendChild(wrapCb);
        wrapLabel.appendChild(document.createTextNode('Перенос строк'));

        var hintSpan = document.createElement('span');
        hintSpan.className = 'rfid-modal-hint';
        hintSpan.textContent = 'Tab — отступ (2 пробела), Shift+Tab — убрать отступ, Ctrl+Enter — вставить';

        controlsRow.appendChild(wrapLabel);
        controlsRow.appendChild(hintSpan);

        var codeArea = document.createElement('textarea');
        codeArea.className = 'rfid-modal-textarea is-code';
        codeArea.spellcheck = false;
        codeArea.setAttribute('autocapitalize', 'off');
        codeArea.setAttribute('autocomplete', 'off');
        codeArea.setAttribute('autocorrect', 'off');
        codeArea.placeholder = '<div class="rfid-widget">\n  <!-- HTML, <style> или <script> -->\n</div>';

        wrapCb.addEventListener('change', function () {
          codeArea.classList.toggle('is-nowrap', !wrapCb.checked);
        });

        codeArea.addEventListener('keydown', function (e) {
          if (e.key === 'Tab') {
            e.preventDefault();
            var val = codeArea.value;
            var start = codeArea.selectionStart;
            var end = codeArea.selectionEnd;

            if (start === end && !e.shiftKey) {
              codeArea.value = val.slice(0, start) + '  ' + val.slice(end);
              codeArea.selectionStart = codeArea.selectionEnd = start + 2;
              return;
            }

            var lineStart = val.lastIndexOf('\n', start - 1) + 1;
            var lineEndIdx = val.indexOf('\n', end);
            var lineEnd = lineEndIdx === -1 ? val.length : lineEndIdx;
            if (end > start && end > lineStart && val.charAt(end - 1) === '\n') {
              lineEnd = end - 1;
            }

            var selectedBlock = val.slice(lineStart, lineEnd);
            var lines = selectedBlock.split('\n');
            var firstDelta = 0;
            var totalDelta = 0;

            var updatedLines = lines.map(function (line, idx) {
              if (e.shiftKey) {
                var removed = 0;
                if (line.indexOf('  ') === 0) {
                  removed = 2;
                } else if (line.charAt(0) === '\t' || line.charAt(0) === ' ') {
                  removed = 1;
                }
                if (idx === 0) firstDelta = -removed;
                totalDelta -= removed;
                return line.slice(removed);
              }
              if (idx === 0) firstDelta = 2;
              totalDelta += 2;
              return '  ' + line;
            });

            codeArea.value = val.slice(0, lineStart) + updatedLines.join('\n') + val.slice(lineEnd);
            var nextStart = Math.max(lineStart, start + firstDelta);
            var nextEnd = Math.max(nextStart, end + totalDelta);
            codeArea.selectionStart = nextStart;
            codeArea.selectionEnd = nextEnd;
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            insertBtn.click();
          }
        });

        body.appendChild(controlsRow);
        body.appendChild(codeArea);

        var footer = document.createElement('div');
        footer.className = 'rfid-modal-footer';

        var status = document.createElement('span');
        status.className = 'rfid-modal-status';

        var btnRow = document.createElement('div');
        btnRow.className = 'rfid-modal-row';

        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'rfid-btn-secondary';
        cancelBtn.textContent = 'Отмена';

        var insertBtn = document.createElement('button');
        insertBtn.type = 'button';
        insertBtn.className = 'rfid-btn-primary';
        insertBtn.textContent = 'Вставить в статью';

        btnRow.appendChild(cancelBtn);
        btnRow.appendChild(insertBtn);
        footer.appendChild(status);
        footer.appendChild(btnRow);

        dialog.appendChild(header);
        dialog.appendChild(body);
        dialog.appendChild(footer);
        backdrop.appendChild(dialog);
        document.body.appendChild(backdrop);

        function close() {
          backdrop.classList.remove('is-open');
          currentOnApply = null;
        }

        closeBtn.addEventListener('click', close);
        cancelBtn.addEventListener('click', close);
        backdrop.addEventListener('click', function (e) {
          if (e.target === backdrop) close();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && backdrop.classList.contains('is-open')) {
            close();
          }
        });

        insertBtn.addEventListener('click', function () {
          var raw = codeArea.value;
          if (!String(raw || '').trim()) {
            status.textContent = 'Введите HTML-код';
            codeArea.focus();
            return;
          }
          var cb = currentOnApply;
          close();
          if (typeof cb === 'function') {
            cb(raw);
          }
        });

        rawHtmlModalEl = {
          open: function (opts) {
            var o = opts || {};
            currentOnApply = typeof o.onApply === 'function' ? o.onApply : null;
            codeArea.value = o.initialValue ? String(o.initialValue) : '';
            status.textContent = o.isEditing ? 'Редактирование выбранного HTML-блока' : '';
            codeArea.classList.toggle('is-nowrap', !wrapCb.checked);
            backdrop.classList.add('is-open');
            setTimeout(function () {
              codeArea.focus();
              if (!codeArea.value) {
                codeArea.selectionStart = codeArea.selectionEnd = 0;
              }
            }, 30);
          }
        };
        return rawHtmlModalEl;
      }

      var lastAutoSlugValue = '';

      function fillLatinSlugFromTitle(force) {
        var ctxWrap = findEditorContext();

        if (!entry) return false;

        var title = String(data.get('title') || '').trim();
        var currentSlug = String(data.get('slug') || '').trim();
        if (!title) return false;
        if (!force && currentSlug && currentSlug !== lastAutoSlugValue) return false;

        var nextSlug = toLatinSlug(title);
        if (!nextSlug) return false;

        var fSlug = props.fields && props.fields.find(function (f) { return f.get('name') === 'slug'; });
        if (fSlug && typeof props.onChange === 'function') {
          lastAutoSlugValue = nextSlug;
          props.onChange(fSlug, nextSlug);
          return true;
        }
        return false;
      }

         6. Cover Image Prompt Generator

      var PROMPT_TEMPLATE_KEY = 'rfid.cms.imgPromptTemplate';
      var PROMPT_MODE_KEY = 'rfid.cms.imgPromptSourceMode';
      var PROMPT_COLLAPSED_KEY = 'rfid.cms.imgPromptCollapsed';
      var LEGACY_DEFAULT_PROMPT_TEMPLATE =
        'Generate a realistic industrial photograph depicting the physical environment and equipment described in the source paragraph below. ' +
        'Visual style: authentic industrial photography, natural or factory lighting, realistic materials (rock, dust, dampness, mining equipment, industrial hardware, rugged sensors), shallow depth of field. ' +
        'Visual constraints: completely clean surfaces with zero text, no words, no letters, no numbers, no signs, no labels, no screens with readable text, no barcodes, no QR codes, and no logos anywhere in the image.\n' +
        'Source context:';
      var DEFAULT_PROMPT_TEMPLATE =
        'Generate a realistic industrial photograph depicting the physical environment and equipment described in the source paragraph below. ' +
        'Visual style: authentic industrial photography, natural or factory lighting, realistic materials (brushed metal, concrete, industrial machinery, rugged housings, cabling, logistics or production environment), shallow depth of field. ' +
        'Visual constraints: completely clean surfaces with zero text, no words, no letters, no numbers, no signs, no labels, no screens with readable text, no barcodes, no QR codes, and no logos anywhere in the image.\n' +
        'Source context:';

      function readStorage(key, fallback) {
        try {
          var v = localStorage.getItem(key);
          return v === null ? fallback : v;
        } catch (_) {
          return fallback;
        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {}
      }

      function decodeBasicEntities(str) {
        return String(str || '')
          .replace(/&nbsp;/gi, ' ')
          .replace(/&amp;/gi, '&')
          .replace(/&lt;/gi, '<')
          .replace(/&gt;/gi, '>')
          .replace(/&quot;/gi, '"')
          .replace(/&#39;/gi, "'");
      }

      function stripMarkdownForPrompt(raw) {
        var s = String(raw || '').replace(/\r\n?/g, '\n');
        s = s
          .replace(/\{\{<\s*rawhtml\s*>\}\}[\s\S]*?\{\{<\s*\/rawhtml\s*>\}\}/gi, ' ')
          .replace(/\{\{[<%][\s\S]*?[>%]\}\}/g, ' ')
          .replace(/<!--[\s\S]*?-->/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
          .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/<br\s*\/?>/gi, ' ')
          .replace(/<\/?(?:sub|sup|strong|b|em|i|code|span|mark|small|u|s|del|ins|a)[^>]*>/gi, '')
          .replace(/<[^>]+>/g, ' ')
          .replace(/`([^`]+)`/g, '$1')
          .replace(/(\*\*|__)([\s\S]*?)\1/g, '$2')
          .replace(/~~([\s\S]*?)~~/g, '$1')
          .replace(/\*([^*\n]+)\*/g, '$1')
          .replace(/(^|[^\w\u0400-\u04FF])_([^_\n]+)_(?=[^\w\u0400-\u04FF]|$)/g, '$1$2');
        s = decodeBasicEntities(s);
        return s.replace(/\s+/g, ' ').trim();
      }

      function cleanLeadingBlockMarkers(chunk) {
        var lines = String(chunk || '').split('\n');
        while (lines.length) {
          var first = lines[0].trim();
          if (
            !first ||
            /^#{1,6}\s+/.test(first) ||
            /^!\[[^\]]*\]\([^)]*\)$/.test(first) ||
            /^[-*_]{3,}$/.test(first) ||
            /^[=-]{3,}$/.test(first)
          ) {
            lines.shift();
            continue;
          }
          break;
        }
        return lines.map(function (ln) {
          return ln.replace(/^\s*>\s?/, '');
        }).join('\n').trim();
      }

      function isNonProseBlock(block) {
        if (!block) return true;
        var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
        if (!lines.length) return true;
        var allTable = lines.every(function (l) { return l.charAt(0) === '|'; });
        if (allTable) return true;
        var allList = lines.every(function (l) { return /^(?:[-*+]|\d+[.)])\s+/.test(l); });
        if (allList) return true;
        var allHrOrHeading = lines.every(function (l) { return /^#{1,6}\s+/.test(l) || /^[-*_]{3,}$/.test(l); });
        return allHrOrHeading;
      }

      function extractParagraphsFromBody(body) {
        var src = String(body || '').replace(/\r\n?/g, '\n');
        src = src
          .replace(/\{\{<\s*rawhtml\s*>\}\}[\s\S]*?\{\{<\s*\/rawhtml\s*>\}\}/gi, '\n\n')
          .replace(/\{\{[<%][\s\S]*?[>%]\}\}/g, '\n\n')
          .replace(/<!--[\s\S]*?-->/g, '\n\n')
          .replace(/```[\s\S]*?```/g, '\n\n')
          .replace(/~~~[\s\S]*?~~~/g, '\n\n');

        var rawChunks = src.split(/\n\s*\n+/);
        var proseParagraphs = [];
        var fallbackParagraphs = [];

        for (var i = 0; i < rawChunks.length; i++) {
          var cleanedBlock = cleanLeadingBlockMarkers(rawChunks[i]);
          if (!cleanedBlock) continue;
          var text = stripMarkdownForPrompt(cleanedBlock);
          if (!text) continue;
          fallbackParagraphs.push(text);
          if (!isNonProseBlock(cleanedBlock)) {
            proseParagraphs.push(text);
          }
        }
        return proseParagraphs.length ? proseParagraphs : fallbackParagraphs;
      }

      function extractSourceTextFromEntry(data, mode) {
        var d = data || {};
        var m = mode || 'first_paragraph';
        var title = stripMarkdownForPrompt(d.title || '');
        var desc = stripMarkdownForPrompt(d.description || '');
        if (m === 'title') return title;
        if (m === 'description') return desc;
        if (m === 'title_desc') {
          if (title && desc) return title + ' — ' + desc;
          return title || desc;
        }
        var paras = extractParagraphsFromBody(d.body || '');
        if (m === 'two_paragraphs') {
          return paras.slice(0, 2).join('\n\n');
        }
        return paras[0] || '';
      }

      function buildCombinedPrompt(template, sourceText) {
        var tpl = String(template || '').replace(/\r\n?/g, '\n');
        var src = String(sourceText || '').trim();
        if (tpl.indexOf('{{source}}') !== -1) {
          return tpl.split('{{source}}').join(src);
        }
        if (!src) return tpl.replace(/\s+$/, '');
        return tpl.replace(/\s+$/, '') + '\n' + src;
      }

      function entryHasBodyField(ctxProps) {
        if (!ctxProps || !ctxProps.fields || typeof ctxProps.fields.find !== 'function') return false;
        return !!ctxProps.fields.find(function (f) { return f.get('name') === 'body'; });
      }

      function copyPlainText(text, onDone) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(text).then(function () {
            onDone(true);
          }).catch(function () {
            fallbackCopy();
          });
          return;
        }
        fallbackCopy();

        function fallbackCopy() {
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            onDone(true);
          } catch (_) {
            onDone(false);
          }
        }
      }

      var promptSyncTimer = null;

      function schedulePromptSync() {
        if (promptSyncTimer) return;

        // Extracted source paragraph field

        srcAutoBtn.type = 'button';

        settings.appendChild(srcField);

        function recomputeFromFields() {
          var sourceVal = state.isSourceCustom ? srcArea.value : state.autoSourceText;
          if (!state.isSourceCustom && srcArea.value !== sourceVal) {
            srcArea.value = sourceVal;
          }
          srcAutoBtn.style.display = state.isSourceCustom ? 'inline' : 'none';

          if (!state.isFinalCustom) {
            finalArea.value = buildCombinedPrompt(tplArea.value, sourceVal);

          finalResetBtn.style.display = state.isFinalCustom ? 'inline' : 'none';

          var modeLabel = modeSelect.options[modeSelect.selectedIndex]
            ? modeSelect.options[modeSelect.selectedIndex].textContent
            : 'Первый абзац';
          if (state.isFinalCustom) {
            statusSpan.textContent = 'Итоговый промпт изменён вручную · ' + finalArea.value.length + ' симв.';
          } else if (state.isSourceCustom) {
            statusSpan.textContent = 'Фрагмент изменён вручную · ' + finalArea.value.length + ' симв.';
          } else if (sourceVal) {
            statusSpan.textContent = 'Авто (' + modeLabel + ': ' + sourceVal.length + ' симв.) · всего ' + finalArea.value.length + ' симв.';
          } else {
            statusSpan.textContent = 'Введите или импортируйте текст статьи — фрагмент подставится автоматически';
          }
        }

        function sync() {
          var routeHash = String(window.location.hash || '');
          if (routeHash !== state.lastRouteHash) {
            state.lastRouteHash = routeHash;
            state.isSourceCustom = false;
            state.isFinalCustom = false;
            state.lastEntrySig = null;
          }

          var current = readCurrentEntryData();
          if (!current || !entryHasBodyField(current.ctx)) {
            panel.style.display = 'none';
            return;
          }
          panel.style.display = 'flex';

          var d = current.data;
          var sig = modeSelect.value + '\0' + d.title + '\0' + d.description + '\0' + d.body;
          if (sig === state.lastEntrySig) return;
          state.lastEntrySig = sig;
          state.autoSourceText = extractSourceTextFromEntry(d, modeSelect.value);
          recomputeFromFields();
        }

        modeSelect.addEventListener('change', function () {
          writeStorage(PROMPT_MODE_KEY, modeSelect.value);

          state.isFinalCustom = false;
          state.lastEntrySig = null;

        });

        tplResetBtn.addEventListener('click', function () {
          tplArea.value = DEFAULT_PROMPT_TEMPLATE;
          writeStorage(PROMPT_TEMPLATE_KEY, DEFAULT_PROMPT_TEMPLATE);

        });

        srcArea.addEventListener('input', function () {

          state.isFinalCustom = false;
          recomputeFromFields();
        });

        srcAutoBtn.addEventListener('click', function () {
          state.isSourceCustom = false;
          state.isFinalCustom = false;
          recomputeFromFields();
        });

        finalArea.addEventListener('input', function () {
          state.isFinalCustom = true;
          recomputeFromFields();
        });

        finalResetBtn.addEventListener('click', function () {
          state.isSourceCustom = false;
          state.isFinalCustom = false;
          state.lastEntrySig = null;
          sync();

          });

        return panel;

      function attachPreviewPromptPanel(previewContainer) {

        if (!current || !entryHasBodyField(current.ctx)) {
          previewContainer.classList.remove('rfid-has-prompt-panel');
          return;
        }
        var iframe = previewContainer.querySelector('iframe#preview-pane');
        var panel = previewContainer.querySelector(':scope > .rfid-prompt-panel');
        if (!panel) {
          panel = createPromptPanelInstance();
          if (iframe) {
            previewContainer.insertBefore(panel, iframe);
          } else {
            previewContainer.insertBefore(panel, previewContainer.firstChild);
          }
        } else if (iframe && panel.nextElementSibling !== iframe) {
          previewContainer.insertBefore(panel, iframe);
        }
        previewContainer.classList.add('rfid-has-prompt-panel');
        if (typeof panel._rfidSyncPrompt === 'function') {
          panel._rfidSyncPrompt();
        }

      function syncAllPromptPanels() {

        }
      }

      document.addEventListener('input', function (e) {
        var target = e.target;
        if (target && target.closest && target.closest('.rfid-prompt-panel')) return;
        if (document.querySelector('.rfid-prompt-panel')) {
          schedulePromptSync();
        }
      }, true);

      document.addEventListener('keyup', function (e) {
        var target = e.target;
        if (target && target.closest && target.closest('.rfid-prompt-panel')) return;
        if (document.querySelector('.rfid-prompt-panel')) {
          schedulePromptSync();
        }
      }, true);

      setInterval(function () {
        if (document.querySelector('.rfid-prompt-panel')) {
          syncAllPromptPanels();
        }
      }, 350);

      function scanDom() {
        var bars = document.querySelectorAll('[class*="EditorControlBar"]');
        for (var i = 0; i < bars.length; i++) {
          attachToolbar(bars[i]);
        }
        var mainSections = document.querySelectorAll('[class*="ToolbarContainer"] > [class*="ToolbarSectionMain"]');
        for (var j = 0; j < mainSections.length; j++) {
          attachTopImportExport(mainSections[j]);
        }
        var appHeaders = document.querySelectorAll('[class*="AppHeaderContent"]');
        for (var k = 0; k < appHeaders.length; k++) {
          attachHeaderRegistryButton(appHeaders[k]);
        }
        var previewContainers = document.querySelectorAll('[class*="PreviewPaneContainer"]');
        for (var p = 0; p < previewContainers.length; p++) {
          attachPreviewPromptPanel(previewContainers[p]);
        }
      }

      var observer = new MutationObserver(scanDom);
      observer.observe(document.body, { childList: true, subtree: true });
      scanDom();
    })();
  </script>
</body>
</html>
