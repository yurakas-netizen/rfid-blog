mainSections = ["post"]
rssFullContent = true
favicon = "img/favicon.svg"
SortBy = "default"

[footer]
    since = 2026
    customText = ""

[dateFormat]
    published = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji = ""
    subtitle = "Інженерна платформа UHF RFID, RTLS та IIoT"
    avatar = "img/avatar.png"

[article]
    headingAnchor = false
    math = false
    readingTime = true

    [article.license]
        enabled = true
        default = "MIT License"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[colorScheme]
toggle = true
default = "dark"

[comments]
    enabled = false
