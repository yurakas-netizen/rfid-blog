toggleMenu = "Alternar menu"
darkMode = "Modo escuro"

[list]
    section = "Seção"
    [list.page]
        one = "{{ .Count }} página"
        other = "{{ .Count }} páginas"
    [list.subsection]
        one = "Subseção"
        other = "Subseções"

[article]
    back = "Voltar"
    tableOfContents = "Índice"
    relatedContent = "Conteúdo relacionado"
    lastUpdatedOn = "Atualizado em"
    [article.readingTime]
        one = "{{ .Count }} minuto de leitura"
        other = "{{ .Count }} minutos de leitura"
    [article.alert]
        note = "Nota"
        tip = "Dica"
        important = "Importante"
        warning = "Aviso"
        caution = "Cuidado"
    [article.codeblock]
        copy = "Copiar"
        copied = "Copiado!"

[notFound]
    title = "Não encontrado"
    subtitle = "Esta página não existe"

[widget]
    [widget.archives]
        title = "Arquivo"
        more = "Mais"
    [widget.tagCloud]
        title = "Tags"
    [widget.categoriesCloud]
        title = "Categorias"

[search]
    title = "Pesquisar"
    placeholder = "Digite algo..."
    resultTitle = "#PAGES_COUNT páginas (#TIME_SECONDS segundos)"
